Στιγμιότυπο · Security 4769 (εξαγωγή)","SIEM · DC Security 4769 (Kerberos Service Ticket)",{path:"event.code:4769 AND winlog.event_data.TicketEncryptionType:0x17",cols:["Ώρα (UTC)","AccountName","ServiceName","EncType","ClientAddress","Status"],rows:[["22:49:08","ntsakos@FIN.CORP","svc-sql","0x17","10.20.30.114","0x0"],["22:49:09","ntsakos@FIN.CORP","svc-backup","0x17","10.20.30.114","0x0"],["22:49:09","ntsakos@FIN.CORP","svc-web","0x17","10.20.30.114","0x0"],["22:49:10","ntsakos@FIN.CORP","svc-exchange","0x17","10.20.30.114","0x0"],["09:12:44","kdimou@FIN.CORP","cifs/fileserv01","0x12","10.20.30.31","0x0"]],hi:[0,4],notes:["Ο ίδιος λογαριασμός ζητά **τέσσερα εισιτήρια διαφορετικών υπηρεσιών σε 2 δευτερόλεπτα** με κρυπτογράφηση **RC4 (0x17)** — μοτίβο Kerberoasting (T1558.003).","Η τελευταία γραμμή είναι φυσιολογική: αίτημα για αρχείο με **AES (0x12)** από τον χρήστη σε ώρες γραφείου. Η σύγκριση με τη βάση αναφοράς είναι ο τρόπος διάκρισης.","Ο δράστης αποκτά τα hash των υπηρεσιών και τα σπάει εκτός δικτύου· το επόμενο βήμα που παρακολουθούμε είναι σύνδεση με λογαριασμό υπηρεσίας από ασυνήθιστο σταθμό."]})],["Η ροή του AiTM",Ae("AiTM με Evilginx: τι βλέπει το θύμα και τι ο δράστης","8.7 Εμβάθυνση · ανατομία της επίθεσης",[["Το θύμα","Λαμβάνει email με σύνδεσμο σε domain που μοιάζει με νόμιμο (π.χ. login-microsoftonline-secure.example). Βλέπει την **πραγματική** σελίδα σύνδεσης, εισάγει κωδικό και κάνει MFA κανονικά. Καμία προειδοποίηση browser δεν εμφανίζεται, γιατί το πιστοποιητικό του domain του δράστη είναι έγκυρο."],["Ο δράστης","Ο διαμεσολαβητής προωθεί κάθε αίτημα στη Microsoft και κάθε απάντηση στο θύμα. Ανάμεσα καταγράφει το όνομα χρήστη, τον κωδικό και το **cookie συνεδρίας (ESTSAUTH)** που εκδίδεται μετά το MFA. Με το cookie συνδέεται από δικό του υπολογιστή χωρίς νέο MFA."],["Τι βλέπει ο ερευνητής","Στα sign-in logs: επιτυχής σύνδεση από την IP του θύματος, και λίγα λεπτά μετά νέα σύνδεση με **ίδιο session ID** από άλλη IP/χώρα και User-Agent. Στα audit logs: δημιουργία κανόνα εισερχομένων, προσθήκη νέας μεθόδου MFA ή πρόσβαση σε mailboxes."]],"Άμυνα: **FIDO2/passkeys**, Conditional Access με συμμόρφωση συσκευής, ανάκληση συνεδριών")],["Ενδείξεις κακόβουλου DNS",Ae("Μετρικές DNS tunneling με πραγματικά νούμερα","8.2 Εμβάθυνση · εντροπία και μήκος",[["Μήκος και εντροπία","Νόμιμα ονόματα («www.example.org») έχουν εντροπία Shannon γύρω στα 2,5–3,3 bit/χαρακτήρα και μικρά subdomains. Κωδικοποιημένα δεδομένα σε base32/hex δίνουν εντροπία πάνω από **3,8** και μήκος πάνω από **50–60** χαρακτήρες — γι' αυτό τα όρια που χρησιμοποιούμε στα ερωτήματα."],["Ρυθμός και μοναδικά ονόματα","Το tunneling παράγει **πολλά μοναδικά** ονόματα κάτω από το ίδιο domain (π.χ. χιλιάδες ανά ώρα) και σχεδόν κανένα επαναλαμβανόμενο. Η μέτρηση distinct(QueryName) ανά (πελάτης, βασικό domain) ξεχωρίζει το tunneling από την κανονική περιήγηση."],["Τύποι εγγραφών","Ασυνήθιστες ποσότητες **TXT, NULL ή CNAME** απαντήσεων και μεγάλα μεγέθη απάντησης δείχνουν αμφίδρομη μεταφορά. Ο έλεγχος συνδυάζεται με τη φήμη του domain (ηλικία εγγραφής) και τη διεργασία που ρώτησε (Sysmon EID 22)."]],"Κανόνας: **μήκος + εντροπία + μοναδικά ονόματα + διεργασία**, όχι ένα μόνο κριτήριο")]]},i2={notes:{"Πλήρης σύλληψη ή μεταδεδομένα;":"Η πλήρης σύλληψη διατηρείται ώρες ή ημέρες και μόνο σε στρατηγικά σημεία· τα μεταδεδομένα του Zeek διατηρούνται μήνες και επιτρέπουν να απαντηθεί «ποιος μίλησε με τον Χ πριν από 90 ημέρες». Στην πράξη ο συνδυασμός τους είναι που κάνει την έρευνα εφικτή.","pcap έναντι μεταδεδομένων":"Ο μηχανισμός είναι κλιμακούμενος: όταν το Zeek βρει κάτι ύποπτο, μπορεί να ενεργοποιηθεί στοχευμένη σύλληψη pcap μόνο για εκείνη τη ροή. Έτσι έχουμε λεπτομέρεια όπου χρειάζεται και οικονομία όπου όχι.","Το Zeek και τα αρχεία του":"Το Zeek (πρώην Bro) παράγει δομημένα logs με βάση την ανάλυση πρωτοκόλλων, όχι υπογραφές. Κάθε σύνδεση παίρνει ένα **uid** (π.χ. CkX1a3…) που εμφανίζεται σε conn.log, dns.log, http.log, ssl.log — με μία αναζήτηση αναπαράγεις όλη τη «ζωή» της σύνδεσης.","Ανίχνευση beaconing":"Το beacon είναι περιοδική επικοινωνία. Οι σύγχρονοι εργαλεία C2 (Cobalt Strike, Sliver) προσθέτουν **jitter** (π.χ. 10–30%) για να εμφανίζονται λιγότερο τακτικά, όμως η στατιστική διασπορά των διαστημάτων παραμένει μικρότερη από αυτή της ανθρώπινης περιήγησης.","Χαρακτηριστικά βαθμολόγησης beacon":"Η βαθμολόγηση συνδυάζει σήματα (τακτικότητα, μέγεθος, διάρκεια, σπανιότητα προορισμού, ώρα). Εργαλεία όπως το RITA (Active Countermeasures) υλοποιούν παρόμοιους υπολογισμούς πάνω σε logs του Zeek και ταξινομούν τα ζεύγη πηγής–προορισμού.","Ορατότητα μέσα στην κρυπτογράφηση":"Με TLS 1.3 το πιστοποιητικό του server είναι κρυπτογραφημένο, όμως το **SNI** (εκτός ECH), το JA3/JA4, τα μεγέθη και οι χρόνοι παραμένουν ορατά. Η κρυπτογράφηση δεν καταργεί την ανάλυση δικτύου — αλλάζει τη φύση της, από περιεχόμενο σε συμπεριφορά.","Τι αποκαλύπτουν τα μεταδεδομένα TLS":"Ένα αυτο-υπογεγραμμένο πιστοποιητικό με διάρκεια 10 ετών, ένα SNI που δεν αντιστοιχεί στην IP ή ένα JA3 που δεν έχει ξαναδεί κανένας άλλος σταθμός του οργανισμού είναι ενδείξεις που δεν χρειάζονται αποκρυπτογράφηση.","DNS over HTTPS":"Το DoH προς δημόσιους resolvers (π.χ. cloudflare-dns.com) παρακάμπτει τον εταιρικό DNS. Ο ερευνητής βλέπει μόνο HTTPS προς γνωστή IP. Η αντιμετώπιση είναι πολιτική: αποκλεισμός γνωστών endpoints DoH και υποχρεωτική χρήση εσωτερικού resolver με καταγραφή.","Δακτυλικά αποτυπώματα TLS: JA3, JA4":"Το JA3 (Salesforce, 2017) είναι MD5 της συμβολοσειράς `TLSVersion,Ciphers,Extensions,EllipticCurves,EllipticCurvePointFormats`. Το JA4 (FoxIO, 2023) είναι ευανάγνωστο και ανθεκτικό σε τυχαία σειρά επεκτάσεων. Χρησιμοποιούνται για ταξινόμηση πελάτη, όχι για απόδειξη ενοχής.","Βαθμίδες διατήρησης και οικονομία":"Η διατήρηση σχεδιάζεται με βάση το τι θα ρωτήσει ο ερευνητής: «τι έκανε αυτός ο σταθμός τις τελευταίες 30 ημέρες;» χρειάζεται ταχύτητα (hot)· «υπήρχε ποτέ επικοινωνία με αυτή την IP πέρσι;» αρκεί αργή αναζήτηση (cold).","Μακρές συνδέσεις και βαθμολόγηση":"Οι συνδέσεις που διαρκούν ώρες ή ημέρες (π.χ. reverse shell, tunnel) φαίνονται στο conn.log από το πεδίο duration. Η ανίχνευση συνδυάζει duration, orig_bytes/resp_bytes (αναλογία αποστολής/λήψης) και σπανιότητα προορισμού.","Το Intel Framework του Zeek":"Με το Intel Framework ο έλεγχος δεικτών γίνεται **στην πηγή**: κάθε νέα σύνδεση, DNS ερώτημα ή πιστοποιητικό ελέγχεται με τη λίστα. Όταν φτάσει νέα αναφορά CTI, φορτώνεται ο δείκτης και ο έλεγχος ισχύει άμεσα, ενώ το αρχείο intel.log δίνει και το `seen.where`.","Από το CTI στο δίκτυο":"Η ροή δεν τελειώνει στο ταίριασμα: κάθε εγγραφή intel.log γίνεται υπόθεση, ελέγχεται με το uid στα υπόλοιπα logs και αν επιβεβαιωθεί ξεκινά το IR. Ο δείκτης ανανεώνεται ή λήγει ανάλογα με το αποτέλεσμα."},add:[["Το Zeek και τα αρχεία του",$("Zeek conn.log: το μοτίβο του beacon","9.3 Στιγμιότυπο · conn.log","zeek-cut · conn.log",{path:"cat conn.log | zeek-cut ts uid id.orig_h id.resp_h id.resp_p proto duration orig_bytes resp_bytes",cols:["ts","uid","src","dst:port","dur","orig","resp"],rows:[["22:39:00.1","CkX1a3","10.20.30.114","198.51.100.44:443","0.412","318","1204"],["22:40:00.0","CkX1b7","10.20.30.114","198.51.100.44:443","0.397","318","1204"],["22:41:00.2","CkX1c2","10.20.30.114","198.51.100.44:443","0.405","318","1204"],["22:41:15.7","Cm93f0","10.20.30.31","203.0.113.20:443","184.0","9210","482113"],["22:42:00.1","CkX1d9","10.20.30.114","198.51.100.44:443","0.401","318","1204"],["22:44:52.3","CoP4a1","10.20.30.22","192.0.2.10:53","0.031","64","112"]],hi:[0,4,3],notes:["Οι συνδέσεις του **10.20.30.114** προς την ίδια IP έχουν διάστημα **60,0 s ± 0,2**, ίδιο orig_bytes (**318**) και σχεδόν ίδια διάρκεια — πρακτικά μηχανική κίνηση.","Ίδιο **resp_bytes (1204)** σημαίνει ότι ο server απαντά πάντα με την ίδια «εντολή»: το πιο πιθανό είναι ένα κενό «sleep» του C2.","Η σύνδεση του 10.20.30.31 (184 s, 482 KB λήψη) είναι κανονική μεγάλη λήψη και όχι beacon — δείχνει γιατί συνδυάζουμε πολλά σήματα."]})],["Δακτυλικά αποτυπώματα TLS: JA3, JA4",$("Πακέτα TLS ClientHello στο Wireshark","9.6 Στιγμιότυπο · Wireshark","Wireshark · capture.pcap · φίλτρο: tls.handshake.type == 1",{path:"Frame 128: 571 bytes on wire · Transmission Control Protocol, Src Port: 51922, Dst Port: 443",cols:["No.","Time","Source","Destination","Protocol","Info"],rows:[["128","0.000000","10.20.30.114","198.51.100.44","TLSv1.2","Client Hello (SNI=cdn.update-check.example)"],["131","0.312410","198.51.100.44","10.20.30.114","TLSv1.2","Server Hello, Certificate, Server Hello Done"],["133","0.315004","10.20.30.114","198.51.100.44","TLSv1.2","Client Key Exchange, Change Cipher Spec"],["402","60.001112","10.20.30.114","198.51.100.44","TLSv1.2","Client Hello (SNI=cdn.update-check.example)"],["690","120.000871","10.20.30.114","198.51.100.44","TLSv1.2","Client Hello (SNI=cdn.update-check.example)"]],hi:[0,3,1],detail:[["Cipher suites","12 (παλιά σειρά)"],["Extensions","9"],["JA3","72a589da586844d7f0818ce684948eea"],["Πιστοποιητικό","Αυτο-υπογεγραμμένο, 10 έτη"]],notes:["Το **SNI cdn.update-check.example** εμφανίζεται σε κάθε ClientHello — είναι ο πιο εύκολος δείκτης για μπλοκάρισμα και για αναζήτηση αναδρομικά στο Zeek ssl.log.","Οι **χρόνοι 0, 60, 120 s** στα ClientHello επιβεβαιώνουν το beacon 60 s και στο επίπεδο TLS χωρίς αποκρυπτογράφηση.","Το **αυτο-υπογεγραμμένο πιστοποιητικό** δεκαετίας και το σπάνιο JA3 ενισχύουν την ταξινόμηση: δεν είναι browser ή νόμιμη εφαρμογή του οργανισμού."]})],["Μακρές συνδέσεις και βαθμολόγηση",$("RITA: βαθμολόγηση beacons πάνω σε logs Zeek","9.8 Στιγμιότυπο · rita show-beacons","RITA · show-beacons -H fin-dataset",{path:"rita show-beacons fin-dataset --human-readable | head",cols:["Score","Πηγή","Προορισμός","Συνδέσεις","Avg Bytes","Διάστημα (σ)","Σχόλιο"],rows:[["0.998","10.20.30.114","198.51.100.44","2871","1522","0.11 s","Πολύ τακτικό"],["0.812","10.20.30.52","192.0.2.80","144","340","4.2 s","Ενημερώσεις λογισμικού"],["0.731","10.20.30.18","203.0.113.55","96","912","8.9 s","Εργαλείο monitoring"],["0.402","10.20.30.61","203.0.113.20","38","48120","142 s","Περιήγηση"]],hi:[0,1],notes:["Η πρώτη γραμμή έχει βαθμό **0,998**: 2.871 συνδέσεις με πρακτικά μηδενική διασπορά διαστημάτων. Πρώτη προτεραιότητα ελέγχου.","Η δεύτερη (0,812) είναι γνωστή υπηρεσία ενημέρωσης — μπαίνει σε **allowlist** με τεκμηρίωση, όχι σε σιωπηλή εξαίρεση.","Το εργαλείο βοηθά στη **σειρά** ελέγχου και όχι στην κρίση: ο αναλυτής επιβεβαιώνει κάθε υποψήφιο με SNI, JA3, DNS και διεργασία."]})],["Δακτυλικά αποτυπώματα TLS: JA3, JA4",Ae("Πώς προκύπτει το JA3 από ένα ClientHello","9.6 Εμβάθυνση · υπολογισμός δακτυλικού αποτυπώματος",[["Τα πέντε πεδία","Το JA3 συνενώνει με κόμματα πέντε λίστες από το ClientHello: **έκδοση TLS**, **cipher suites**, **επεκτάσεις**, **ελλειπτικές καμπύλες** και **μορφές σημείων**. Κάθε λίστα γράφεται με παύλες, π.χ. `771,4865-4866-49195,0-23-65281,29-23-24,0`."],["Από συμβολοσειρά σε MD5","Η τελική συμβολοσειρά περνά από MD5 και παράγει το 32-ψήφιο JA3 (π.χ. `72a589da586844d7f0818ce684948eea`). Το ίδιο λογισμικό με τις ίδιες βιβλιοθήκες δίνει σταθερό JA3, οπότε συγκεκριμένα εργαλεία C2 αναγνωρίζονται από τη βιβλιοθήκη που χρησιμοποιούν."],["Περιορισμοί","Το ίδιο JA3 μπορεί να ανήκει σε νόμιμο και κακόβουλο λογισμικό με την ίδια βιβλιοθήκη, ενώ οι browsers που τυχαιοποιούν επεκτάσεις (Chrome) αλλάζουν JA3. Το **JA4** ταξινομεί τις επεκτάσεις πριν τον κατακερματισμό και προσθέτει αναγνώσιμο πρόθεμα."]],"Χρήση: **ομαδοποίηση και σπανιότητα** — ποτέ μοναδική απόδειξη")],["Μακρές συνδέσεις και βαθμολόγηση",Ae("Μακρές συνδέσεις και εξαγωγή δεδομένων","9.8 Εμβάθυνση · τι δείχνει η αναλογία bytes",[["Αναλογία αποστολής/λήψης","Στην περιήγηση ο πελάτης στέλνει λίγα και λαμβάνει πολλά (π.χ. 1:50). Στην εξαγωγή δεδομένων η αναλογία **αντιστρέφεται**: orig_bytes πολύ μεγαλύτερο από resp_bytes. Ένα conn.log με 2 GB orig_bytes προς μία IP είναι υποψήφιο exfiltration."],["Χρόνος και διάρκεια","Μεγάλη διάρκεια με μικρή κίνηση (π.χ. 6 ώρες, 40 KB) υποδεικνύει διατήρηση συνεδρίας — τυπικό για reverse shell ή tunnel. Η μεγάλη κίνηση σε νυχτερινές ώρες αυξάνει την υποψία, ιδίως αν προέρχεται από σταθμό χρήστη."],["Επιβεβαίωση","Ο αναλυτής ελέγχει ssl.log (SNI/πιστοποιητικό), files.log για μεταφερόμενα αρχεία και Sysmon EID 3 για τη διεργασία. Αν είναι διαθέσιμο, ζητά στοχευμένο pcap για τη ροή και εντοπίζει τον όγκο και τη μορφή των δεδομένων."]],"Πρακτικό κατώφλι: **ρώτα κάθε μεταφορά εξόδου > 500 MB προς σπάνιο προορισμό**")]]},s2={notes:{"IDS και IPS: παρατηρητής ή τροχονόμος":"Ο IDS βλέπει αντίγραφο της κίνησης (SPAN/TAP) και δεν επηρεάζει τη ροή· ο IPS βρίσκεται inline και μπορεί να αποκλείει. Στην πράξη οι περισσότεροι οργανισμοί ξεκινούν IDS, μετρούν τα ψευδώς θετικά και ενεργοποιούν drop μόνο για κανόνες υψηλής εμπιστοσύνης.","Ανατομία κανόνα Suricata":"Ένας κανόνας έχει header (`alert http $HOME_NET any -> $EXTERNAL_NET any`) και options σε παρένθεση. Οι sticky buffers (π.χ. `http.user_agent;`) ορίζουν σε ποιο πεδίο εφαρμόζεται το επόμενο `content`. Το `sid` και το `rev` είναι υποχρεωτικά για διαχείριση εκδόσεων.","Η έξοδος EVE JSON":"Η έξοδος EVE (Extensible Event Format) είναι μία γραμμή JSON ανά γεγονός. Εκτός από `alert`, περιέχει `dns`, `http`, `tls`, `flow`, `fileinfo` και `anomaly`. Έτσι το ίδιο εργαλείο τροφοδοτεί ανίχνευση και τηλεμετρία στο SIEM, χωρίς επιπλέον parsing.","Η διαδρομή της καταγραφής":"Η αξιοπιστία της μεταφοράς είναι τεχνικό ζήτημα με νομικές συνέπειες: ένας συναγερμός που χάθηκε λόγω πλήρους ουράς είναι ανίχνευση που δεν έγινε. Οι μετρικές υγείας (καθυστέρηση, μέγεθος ουράς, σιωπή πηγής) παρακολουθούνται όπως οι ίδιοι οι συναγερμοί.","Διαδρομή καταγραφής προς το SIEM":"Ο πράκτορας κρατά buffer στο δίσκο όταν ο προορισμός δεν απαντά και ξαναστέλνει με αποδιπλασιασμό στο τέλος (at-least-once). Η ουρά (π.χ. Kafka) απορροφά αιχμές και επιτρέπει πολλαπλούς καταναλωτές: SIEM, αρχείο, data lake.","Αξιοπιστία της μεταφοράς":"Η ασφάλεια της μεταφοράς έχει δύο σκέλη: εμπιστευτικότητα (TLS) και ακεραιότητα/διαθεσιμότητα (buffer, επαναποστολή). Όταν ο αντίπαλος ελέγχει το δίκτυο, το mutual TLS αποτρέπει την έγχυση ψεύτικων συμβάντων.","Πού βλέπει το δίκτυο":"Ένας αισθητήρας βλέπει μόνο ό,τι περνά από το σημείο του. Η κίνηση εσωτερικά (east-west), μέσα σε VLAN ή σε cloud δεν φαίνεται από τον αισθητήρα περιμέτρου. Γι' αυτό η τοποθέτηση σχεδιάζεται με βάση τις διαδρομές επίθεσης που θέλουμε να καλύψουμε.","Χάρτης τοποθέτησης αισθητήρων":"Η κρυπτογραφημένη κίνηση περιορίζει το περιεχόμενο αλλά όχι τα μεταδεδομένα. Η αποκρυπτογράφηση TLS (proxy) είναι ξεχωριστό έργο με νομικές και τεχνικές επιπτώσεις — δεν είναι προϋπόθεση για χρήσιμη ανίχνευση.","Συντονισμός κανόνων":"Ο συντονισμός δεν είναι «σίγαση». Κάθε suppress έχει ιδιοκτήτη, λόγο και ημερομηνία επανεξέτασης. Χωρίς αυτά, μετά από ένα χρόνο κανείς δεν ξέρει γιατί ένας σημαντικός κανόνας δεν ενεργοποιείται ποτέ.","Ο κύκλος συντονισμού":"Ξεκινάτε από τους 10 θορυβωδέστερους κανόνες: συνήθως παράγουν πάνω από το 70% των ειδοποιήσεων. Καθένας κρίνεται ως: πραγματική απειλή, νόμιμη δραστηριότητα ή κακός κανόνας — και αντιμετωπίζεται αντίστοιχα.","Πέρα από τους συναγερμούς":"Το Suricata δεν είναι μόνο ειδοποιήσεις: εξάγει αρχεία με hash (files), καταγράφει πρωτόκολλα και διατηρεί datasets. Έτσι λειτουργεί και ως πηγή πειστηρίων δικτύου, όχι μόνο ως ανιχνευτής.","Community ID: το κοινό κλειδί":"Το Community ID είναι hash της πεντάδας (πρωτόκολλο, IP πηγής/προορισμού, θύρες) με ανεξάρτητη από κατεύθυνση κανονικοποίηση. Το ίδιο ID εμφανίζεται σε alert του Suricata, σε conn.log του Zeek και σε κάποια EDR — ενώνοντάς τα χωρίς προσαρμογές.","Όταν ο συναγερμός γίνεται απόφαση":"Το ίδιο alert έχει διαφορετική βαρύτητα ανάλογα με το asset: «Trojan activity» σε σταθμό δοκιμών ≠ «Trojan activity» σε ελεγκτή τομέα. Η ιεράρχηση προσθέτει κρισιμότητα, επιτυχία της επίθεσης και συσχέτιση με άλλες πηγές."},add:[["Η έξοδος EVE JSON",$("Πλήρες συμβάν alert στο eve.json","10.3 Στιγμιότυπο · /var/log/suricata/eve.json","eve.json · event_type = alert (μορφοποιημένο)",{path:`jq 'select(.event_type=="alert")' eve.json | head -30`,lines:["{",'  "timestamp": "2026-03-13T22:39:20.412331+0000",','  "event_type": "alert",','  "src_ip": "10.20.30.114", "src_port": 51922,','  "dest_ip": "198.51.100.44", "dest_port": 443,','  "proto": "TCP",','  "community_id": "1:LQU9qZlK+B5F3KDmev6m5PMibrg=",','  "alert": {','    "action": "allowed", "gid": 1, "signature_id": 1000001,','    "signature": "LOCAL C2 beacon suspicious UA",','    "category": "A Network Trojan was detected", "severity": 1',"  },",'  "http": { "hostname": "cdn.update-check.example", "http_user_agent": "Mozilla/4.0 (compatible; MSIE 6.0)" },','  "flow_id": 1518300771244911',"}"],hi:[6,8,12],notes:["Το **community_id** είναι το κλειδί που ενώνει αυτό το alert με το conn.log του Zeek και με τα δεδομένα του SIEM για την ίδια σύνδεση.","Η ενέργεια είναι **allowed**: ο αισθητήρας λειτούργησε ως IDS και η κίνηση πέρασε. Σε IPS, εδώ θα φαινόταν `blocked` και η σύνδεση θα είχε κοπεί.","Το **User-Agent MSIE 6.0** είναι αναχρονιστικό — κανένας σύγχρονος υπολογιστής δεν το χρησιμοποιεί, οπότε ταιριάζει σε δείγμα malware."]})],["Ανατομία κανόνα Suricata",$("Το αρχείο local.rules με σχολιασμό","10.2 Στιγμιότυπο · /etc/suricata/rules/local.rules","local.rules · Suricata 7",{path:"/etc/suricata/rules/local.rules",lines:["# INC-2026-0117 · svhost32 beacon · author: KS · rev 2026-03-14",'alert http $HOME_NET any -> $EXTERNAL_NET any (msg:"LOCAL C2 beacon suspicious UA";','  flow:established,to_server; http.user_agent; content:"MSIE 6.0"; nocase;','  http.host; content:"update-check"; classtype:trojan-activity;',"  threshold:type limit, track by_src, count 1, seconds 600; sid:1000001; rev:2;)","",'alert tls $HOME_NET any -> $EXTERNAL_NET any (msg:"LOCAL C2 SNI cdn.update-check";','  tls.sni; content:"cdn.update-check.example"; endswith;','  ja3.hash; content:"72a589da586844d7f0818ce684948eea";',"  classtype:trojan-activity; sid:1000002; rev:1;)","",'alert dns $HOME_NET any -> any any (msg:"LOCAL DNS tunnel long query";','  dns.query; pcre:"/^[a-z0-9]{40,}\\./i"; sid:1000003; rev:1;)'],hi:[2,8,12],notes:["Το `flow:established,to_server` και οι δύο **sticky buffers** (user_agent, host) περιορίζουν τον κανόνα ώστε να μην πυροδοτείται σε άσχετη κίνηση.","Ο δεύτερος κανόνας συνδυάζει **SNI και JA3**: δύο ανεξάρτητα χαρακτηριστικά — μειώνει τα ψευδώς θετικά χωρίς αποκρυπτογράφηση.","Το **pcre** για ονόματα 40+ χαρακτήρων ανιχνεύει DNS tunneling. Οι κανονικές εκφράσεις είναι ακριβές — χρησιμοποιούνται μετά από ένα φθηνότερο φίλτρο."]})],["Ο κύκλος συντονισμού",$("Κορυφαίοι κανόνες ανά όγκο πριν το tuning","10.6 Στιγμιότυπο · Kibana · Suricata dashboard","Kibana · Suricata Alerts · τελευταίες 7 ημέρες",{path:"event.dataset: suricata.eve AND event.kind: alert | Top signatures",cols:["Signature","Alerts","% όγκου","Κρίση","Ενέργεια"],rows:[["ET INFO Observed DNS Query to .cloud TLD","48.220","31%","Θόρυβος","Suppress (γνωστά)"],["ET POLICY PE EXE or DLL Windows file download","27.905","18%","Θόρυβος","Threshold ανά πηγή"],["ET SCAN Nmap Scripting Engine User-Agent","9.311","6%","Εσωτερικός σαρωτής","Suppress IP σαρωτή"],["LOCAL C2 beacon suspicious UA","128","0,1%","Πραγματική απειλή","Διατήρηση, SEV-2"],["ET EXPLOIT Apache Log4j RCE Attempt","62","0,04%","Απόπειρες από internet","Διατήρηση, έλεγχος επιτυχίας"]],hi:[0,3],notes:["Οι δύο πρώτοι κανόνες δίνουν το **49%** του όγκου αλλά καμία αξία. Με suppress/threshold η ουρά μειώνεται στο μισό χωρίς απώλεια ανίχνευσης.","Ο τοπικός κανόνας C2 έχει μόλις **128 alerts** αλλά είναι ο μοναδικός με ένδειξη ενεργού αντιπάλου — ο όγκος δεν ταυτίζεται με την αξία.","Ο κανόνας Log4j δείχνει **απόπειρες**. Ο έλεγχος επιτυχίας (σύνδεση εξόδου προς LDAP/RMI από τον server) καθορίζει αν χρειάζεται κλιμάκωση."]})],["Πού βλέπει το δίκτυο",Ae("Οι παγίδες της τοποθέτησης αισθητήρων","10.5 Εμβάθυνση · τι δεν βλέπει ένας αισθητήρας",[["NAT και proxies","Αν ο αισθητήρας βρίσκεται **μετά** το NAT ή τον proxy, όλοι οι εσωτερικοί πελάτες φαίνονται με μία IP. Η ανίχνευση σε επίπεδο σταθμού (ποιος σταθμός) προϋποθέτει αισθητήρα πριν το NAT ή logs του proxy με X-Forwarded-For."],["Κρυπτογραφημένη κίνηση","Στο TLS 1.3 το περιεχόμενο δεν αναλύεται. Οι κανόνες βασίζονται σε SNI, JA3/JA4, μεγέθη και χρόνους. Οι κανόνες περιεχομένου HTTP δεν θα ενεργοποιηθούν σε HTTPS, οπότε η κάλυψη πρέπει να δοκιμάζεται (π.χ. με pcap δοκιμής)."],["Απώλειες πακέτων","Ένας υπερφορτωμένος αισθητήρας χάνει πακέτα και οι κανόνες δεν πυροδοτούνται· τα στατιστικά stats.log (`capture.kernel_drops`) πρέπει να παρακολουθούνται. Το SPAN μπορεί επίσης να απορρίπτει πακέτα σε υψηλό φορτίο — το TAP είναι πιο αξιόπιστο."]],"Έλεγχος: **στέλνουμε γνωστό δείγμα (pcap) και βεβαιωνόμαστε ότι ο κανόνας ενεργοποιείται**")],["Όταν ο συναγερμός γίνεται απόφαση",Ae("Ένα alert, τρεις αποφάσεις: ιεράρχηση με πλαίσιο","10.9 Εμβάθυνση · από το σήμα στη δράση",[["Alert 1 · σταθμός δοκιμών","«ET SCAN Nmap» από εσωτερικό σαρωτή ευπαθειών, γνωστή IP, εντός προγραμματισμένου παραθύρου. **Απόφαση:** κλείσιμο ως αναμενόμενο, με καταγραφή της αντιστοίχισης στο πρόγραμμα σάρωσης και προσθήκη στο suppress."],["Alert 2 · web server","«Log4j RCE Attempt» προς server DMZ από εξωτερική IP. Αν ο server δεν χρησιμοποιεί Log4j ή έχει διορθωθεί, χαμηλή βαρύτητα. Αν όμως υπάρχει **εξερχόμενη σύνδεση προς την ίδια IP** μετά το alert, κλιμάκωση σε SEV-1 και απομόνωση."],["Alert 3 · ελεγκτής τομέα","«Trojan activity» από DC προς άγνωστη IP. Η κρισιμότητα του asset και το γεγονός ότι οι DC δεν πρέπει να επικοινωνούν με το διαδίκτυο, οδηγούν σε **άμεση κλιμάκωση Tier 2** ακόμη κι αν ο κανόνας έχει χαμηλή σοβαρότητα."]],"Η ιεράρχηση = **σοβαρότητα κανόνα × κρισιμότητα asset × επιτυχία × συσχέτιση**")]]},c2={notes:{"Τα στρώματα ενός SIEM":"Ένα SIEM δεν είναι μία «βάση logs» αλλά αλυσίδα: συλλογή → κανονικοποίηση → αποθήκευση → ανίχνευση → απόκριση. Η αδυναμία ενός στρώματος περιορίζει όλα τα επόμενα: κακό parsing σημαίνει κανόνες που δεν ενεργοποιούνται ποτέ.","Το SIEM ως στοίβα":"Στην πράξη οι ομάδες επενδύουν στο πάνω μέρος (ανίχνευση, UEBA) και παραμελούν το κάτω (συλλογή, ποιότητα δεδομένων). Οι περισσότερες αποτυχίες ανίχνευσης οφείλονται σε δεδομένα που δεν έφτασαν, όχι σε λάθος κανόνα.","Η διαδρομή ενός συμβάντος":"Ο χρόνος «γεγονός → συναγερμός» (ingest latency) πρέπει να μετριέται. Ένα συμβάν που φτάνει 30 λεπτά αργότερα δεν θα ενεργοποιήσει κανόνα με παράθυρο 10 λεπτών, ακόμη κι αν ο κανόνας είναι σωστός.","Από το ερώτημα στη συσχέτιση":"Ένα καλό ερώτημα κυνηγιού που επαναλαμβάνεται συχνά πρέπει να γίνει κανόνας. Ο μετασχηματισμός απαιτεί: σταθερό χρονικό παράθυρο, κατώφλι, εξαιρέσεις για γνωστά συστήματα και τεκμηρίωση ιδιοκτήτη και προσδοκώμενων ψευδώς θετικών.","Το χρονικό παράθυρο της συσχέτισης":"Το παράθυρο ορίζει πόσο μακριά μπορεί να είναι δύο γεγονότα για να θεωρηθούν συσχετισμένα. Πολύ μικρό χάνει αργές επιθέσεις, πολύ μεγάλο παράγει ψευδώς θετικά. Αρχίζουμε με τη διάρκεια που παρατηρήθηκε σε πραγματικές περιπτώσεις.","Κανονικοποίηση στην πράξη":"Το ECS (Elastic Common Schema) και το OCSF (Open Cybersecurity Schema Framework) είναι δημοφιλή κοινά σχήματα. Στην πράξη δεν κανονικοποιούνται τα πάντα: ξεκινάτε από τα πεδία που χρησιμοποιούν οι κανόνες (source.ip, user.name, process.command_line).","Ποιότητα δεδομένων":"Ένα ημερήσιο έλεγχος ποιότητας ελέγχει: αναμενόμενος όγκος ανά πηγή, καθυστέρηση εισαγωγής, αναλογία συμβάντων που απέτυχαν στο parsing και πεδία που λείπουν. Έτσι φαίνεται μια πηγή που «σιώπησε» πριν το ανακαλύψει ο αντίπαλος.","Ο κανόνας του μη παρακολουθούμενου εύρους":"Το εύρος (scope) ορίζεται από την απογραφή: ό,τι υπάρχει στο CMDB και δεν στέλνει logs είναι τυφλό σημείο. Μετράμε το ποσοστό κάλυψης ανά κατηγορία και το παρακολουθούμε ως μετρική ωριμότητας.","Η οικονομία της αναδρομής":"Το κόστος εξαρτάται από όγκο και διατήρηση. Στρατηγική: πλήρη δεδομένα για κρίσιμες πηγές (DC, EDR, DNS) σε hot 90 ημέρες· αρχειοθέτηση συμπιεσμένη για 12+ μήνες· και ανά περίπτωση «rehydration» παλιών δεδομένων όταν χρειαστεί.","Από τον συναγερμό στην υπόθεση":"Η υπόθεση (case) είναι η μονάδα εργασίας: ενώνει πολλά alerts, πειστήρια, ενέργειες και σχόλια. Η καλή πρακτική είναι να ανοίγει case μόνο όταν υπάρχει πραγματική ανάγκη δράσης — όχι για κάθε alert.","Διαλογή συναγερμού":"Ο εμπλουτισμός γίνεται αυτόματα (SOAR/ενσωματώσεις) πριν φτάσει στον αναλυτή: κρισιμότητα asset, φήμη IP, ιστορικό χρήστη, προηγούμενα alerts. Έτσι ο αναλυτής αφιερώνει χρόνο στην κρίση και όχι στη συλλογή πληροφοριών.","UEBA: όταν ο κανόνας":"Το UEBA χρειάζεται εβδομάδες δεδομένων για να μάθει «κανονική» συμπεριφορά και παράγει βαθμολογίες κινδύνου. Οι αναλυτές πρέπει να μπορούν να δουν **γιατί** ένας λογαριασμός βαθμολογήθηκε ψηλά — αλλιώς δεν εμπιστεύονται το αποτέλεσμα.","Σήματα UEBA για έναν λογαριασμό":"Κανένα σήμα μόνο του δεν είναι ύποπτο: μια ασυνήθιστη ώρα μπορεί να είναι υπερωρία. Το UEBA προσθέτει μικρά σήματα σε συνολική βαθμολογία. Εδώ το πρώτο προνομιούχο ενέργημα, η νέα χώρα και ο μεγάλος όγκος μαζί δίνουν υψηλή βαθμολογία."},add:[["Το χρονικό παράθυρο της συσχέτισης",$("Splunk: ο κανόνας ακολουθίας 4625 → 4624 → Sysmon 1","11.2 Στιγμιότυπο · αποτελέσματα κανόνα","Splunk Enterprise Security · Correlation Search",{path:"| tstats … by src_ip, user  | where fails>=10 AND ok>=1 | join process_create",tabs:["Results (2)","Notable Events","Rule definition"],cols:["Ώρα","src_ip","user","fails (4625)","ok (4624 T10)","Διεργασία μετά (Sysmon 1)"],rows:[["22:20–22:31","198.51.100.44","ntsakos","37","1","wscript.exe → svhost32.exe"],["09:00–09:10","10.20.30.31","kdimou","11","1","— (κλείδωμα κωδικού, νόμιμο)"]],hi:[0],detail:[["Κανόνας","BruteForce→Success→Exec"],["MITRE","T1110 → T1078 → T1059"],["Severity","High"],["Ιδιοκτήτης","Detection Engineering"]],notes:["Ο κανόνας ενώνει **τρία γεγονότα σε ένα**: πολλές αποτυχίες, επιτυχής RDP και εκτέλεση διεργασίας. Κανένα δεν αρκεί μόνο του, μαζί δίνουν υψηλή βεβαιότητα.","Η δεύτερη γραμμή δείχνει **ψευδώς θετικό**: ο χρήστης έκανε λάθος στον κωδικό (11 αποτυχίες) και μετά συνδέθηκε εσωτερικά, χωρίς ύποπτη διεργασία. Το τρίτο σκέλος το φιλτράρει.","Το πεδίο **MITRE** και ο **ιδιοκτήτης** κάνουν τον κανόνα διαχειρίσιμο: ξέρουμε τι καλύπτει και ποιος τον συντηρεί."]})],["Ο κανόνας του μη παρακολουθούμενου εύρους",$("Πίνακας υγείας πηγών logs","11.4 Στιγμιότυπο · Log Source Health","SIEM · Data Source Health Dashboard",{path:"Τελευταία ενημέρωση: 2026-03-14 12:30 UTC · αναμενόμενο ≥ 95% κάλυψη",cols:["Πηγή","Assets (CMDB)","Στέλνουν logs","Κάλυψη","Καθυστέρηση","Κατάσταση"],rows:[["Domain Controllers","4","4","100%","8 s","OK"],["Windows Servers","132","118","89%","14 s","Ελλείψεις"],["Workstations (Sysmon)","1.480","1.041","70%","22 s","Ελλείψεις"],["Firewalls / VPN","6","5","83%","3 s","Ελλείψεις"],["Microsoft 365 audit","1","1","100%","9 min","Καθυστέρηση"],["Linux web servers","24","9","37%","—","ΚΡΙΣΙΜΟ"]],hi:[5,2,4],notes:["Οι **Linux web servers** έχουν κάλυψη 37% και αποτελούν την πιο εκτεθειμένη κατηγορία: εκεί συμβαίνουν οι εκμεταλλεύσεις webshell. Πρώτη προτεραιότητα.","Οι σταθμοί με Sysmon (**70%**) είναι η κύρια πηγή τηλεμετρίας για διεργασίες — κάθε ποσοστό που λείπει είναι μονοπάτι χωρίς ανίχνευση.","Η καθυστέρηση **9 λεπτών** στο Microsoft 365 σημαίνει ότι κανόνες AiTM με παράθυρο 5 λεπτών δεν θα λειτουργήσουν σωστά."]})],["Από το ερώτημα στη συσχέτιση",$("KQL: κανόνας ακολουθίας στο Microsoft Sentinel","11.2 Στιγμιότυπο · Analytics rule","Microsoft Sentinel · Analytics · Scheduled rule",{path:"Rule: Brute force followed by RDP success and process creation",lines:["let window = 30m;","let fails = SecurityEvent | where EventID == 4625","  | summarize failCount=count() by IpAddress, bin(TimeGenerated, window)","  | where failCount >= 10;","let rdp = SecurityEvent | where EventID == 4624 and LogonType == 10","  | project SuccessTime=TimeGenerated, IpAddress, Account=TargetUserName, TargetLogonId;","fails | join kind=inner rdp on IpAddress","  | join kind=inner (SecurityEvent | where EventID == 4688","      | project ProcTime=TimeGenerated, SubjectLogonId, NewProcessName, CommandLine)","    on $left.TargetLogonId == $right.SubjectLogonId","  | where ProcTime between (SuccessTime .. SuccessTime + 15m)","  | project SuccessTime, IpAddress, Account, NewProcessName, CommandLine, failCount"],hi:[3,6,9],notes:["Το κατώφλι **failCount >= 10** μέσα σε παράθυρο 30 λεπτών ορίζει την πρώτη προϋπόθεση (brute force) και μειώνει τον θόρυβο κανονικών λαθών κωδικού.","Ο **inner join** πάνω στην IP και στο επόμενο στάδιο εξασφαλίζει ότι όλα τα σκέλη έχουν πραγματικά συμβεί — δεν είναι απλή ένωση λιστών.","Το **LogonId** ενώνει τη σύνδεση με τις διεργασίες της ίδιας συνόδου, όπως στο Κεφάλαιο 5: το πιο αξιόπιστο κλειδί συσχέτισης στα Windows."]})],["Η οικονομία της αναδρομής",Ae("Το οικονομικό μοντέλο ενός SIEM: πραγματικοί υπολογισμοί","11.5 Εμβάθυνση · όγκος, διατήρηση, κόστος",[["Υπολογισμός όγκου","Ένας οργανισμός με 1.500 σταθμούς και 150 servers παράγει τυπικά 3.000–10.000 EPS με Sysmon και Security. Με 250 byte ανά συμβάν, 5.000 EPS = **≈ 108 GB/ημέρα**. Με διατήρηση 90 ημερών hot απαιτούνται περίπου 9,7 TB ωφέλιμου χώρου (πριν τη συμπίεση 5–10×)."],["Επιλογές μείωσης","Το **φιλτράρισμα στην πηγή** (Sysmon config, audit policy) μειώνει τον όγκο πριν καν φτάσει. Η **δειγματοληψία** χαμηλής αξίας (π.χ. netflow) και η **αναγωγή** (aggregation) σε πίνακες μειώνουν το κόστος αποθήκευσης διατηρώντας τα κρίσιμα πεδία."],["Κόστος αναδρομής","Το ερώτημα «τι έκανε ο σταθμός Χ πριν 6 μήνες;» απαιτεί δεδομένα σε warm/cold. Αν το αρχείο απαιτεί ώρες για επανεπεξεργασία, ο ερευνητής πρέπει να το γνωρίζει πριν το περιστατικό — και οι διατηρήσεις να συμφωνούν με τον χρόνο παραμονής αντιπάλου (10–60+ ημέρες)."]],"Κανόνας: **η διατήρηση ορίζεται από τα ερωτήματα των ερευνών, όχι από τον προϋπολογισμό μόνο**")],["Διαλογή συναγερμού",Ae("Η ζωή μιας υπόθεσης (case) στο SOC","11.6 Εμβάθυνση · από το alert στο κλείσιμο",[["Άνοιγμα και ανάθεση","Το case ανοίγει με μοναδικό αναγνωριστικό, σοβαρότητα (SEV), ιδιοκτήτη και SLA. Συνδέει τα σχετικά alerts και τα αρχικά πειστήρια. Ο ιδιοκτήτης έχει την ευθύνη κλιμάκωσης και επικοινωνίας — όχι μόνο της ανάλυσης."],["Εργασία και τεκμηρίωση","Κάθε ενέργεια καταγράφεται στο case: ερωτήματα που εκτελέστηκαν, ευρήματα, ενέργειες απόκρισης, επικοινωνίες. Οι συνδέσεις με πειστήρια (E-00X) και τα hash επισυνάπτονται. Το case γίνεται η **πηγή για την τελική αναφορά**."],["Κλείσιμο και ανατροφοδότηση","Το case κλείνει με κατηγορία (αληθές/ψευδώς θετικό, αποδεκτό ρίσκο), βασική αιτία και ενέργειες βελτίωσης (νέος κανόνας, tuning, patch). Τα ψευδώς θετικά τροφοδοτούν το tuning και οι αληθείς οδηγούν σε νέες ανιχνεύσεις."]],"Ένα case χωρίς **κλείσιμο και ανατροφοδότηση** δεν βελτιώνει τον οργανισμό")]]},u2={notes:{"Η ανίχνευση ως μηχανική πειθαρχία":"Η διαφορά μεταξύ «γράφω κανόνες» και «μηχανική ανίχνευσης» είναι η διαδικασία: απαίτηση, σχεδιασμός, δοκιμή, διάθεση, συντήρηση. Κάθε κανόνας έχει ιδιοκτήτη, εκδόσεις και μετρικές, ακριβώς όπως ένα κομμάτι λογισμικού παραγωγής.","Ο κύκλος ζωής της ανίχνευσης":"Ο κύκλος δεν τελειώνει με τη διάθεση: ένας κανόνας που δεν ενεργοποιήθηκε ποτέ μπορεί να είναι λάθος ή να προστατεύει από απειλή που δεν εμφανίστηκε. Ο έλεγχος με προσομοίωση (Atomic) το ξεχωρίζει. Η αποσύρσή του τεκμηριώνεται όπως η δημιουργία.","Ποιότητες ενός καλού κανόνα":"Ο ισχυρός κανόνας έχει ισορροπία ακρίβειας και κάλυψης: πολύ ειδικός χάνει παραλλαγές, πολύ γενικός γεμίζει ψευδώς θετικά. Μετρικές όπως precision, recall και χρόνος ανάλυσης ανά alert καθορίζουν αν αξίζει η συντήρησή του.","Sigma: ο κοινός ενδιάμεσος":"Το Sigma είναι ο «κοινός τύπος» των ανιχνεύσεων: ο κανόνας γράφεται μία φορά και μεταφράζεται σε Splunk, KQL, Elastic κ.ά. Το αποθετήριο SigmaHQ περιέχει χιλιάδες κανόνες που αντιστοιχούν σε ATT&CK και αποτελούν σημείο εκκίνησης, όχι τελικό προϊόν.","Μετατροπή Sigma σε SIEM":"Ο μετατροπέας χρειάζεται pipeline που αντιστοιχίζει τα πεδία του Sigma (Image, CommandLine) στο σχήμα του SIEM σας (ECS, CIM). Χωρίς σωστό pipeline ο κανόνας μεταφράζεται συντακτικά αλλά δεν βρίσκει τίποτα.","Από το CTI στην ανίχνευση":"Η αναφορά CTI περιγράφει πάντα συμπεριφορές. Η μετάφραση ζητά συγκεκριμένη πηγή δεδομένων: αν δεν έχουμε την τηλεμετρία (π.χ. Sysmon 10), η υπόθεση δεν μπορεί να ανιχνευθεί και η αδυναμία καταγράφεται ως **κενό δεδομένων**.","Από την αναφορά στον κανόνα":"Οι πραγματικές αναφορές (CISA, Mandiant, Microsoft) δίνουν συχνά έτοιμες ενδείξεις και κανόνες Sigma/YARA. Ο μηχανικός τους επαληθεύει στο δικό του περιβάλλον, προσαρμόζει πεδία και εξαιρέσεις και τους καταχωρεί με αναφορά στην πηγή.","YARA: ανίχνευση σε αρχεία":"Ο κανόνας YARA συνδυάζει strings, hex μοτίβα και συνθήκες (π.χ. `uint16(0)==0x5A4D` για PE). Εφαρμόζεται σε αρχεία, dumps μνήμης (Volatility yarascan) και ροές δικτύου. Είναι ισχυρός όταν οι strings προέρχονται από ανάλυση πραγματικού δείγματος.","Detection-as-Code: ο κύκλος ζωής":"Τα αποθετήρια κανόνων ακολουθούν τα ίδια πρότυπα με τον κώδικα: pull requests, review από δεύτερο μηχανικό, αυτόματες δοκιμές και σταδιακή διάθεση. Έτσι μειώνεται ο κίνδυνος μιας λανθασμένης αλλαγής που θα παράγει χιλιάδες ψευδώς θετικά.","Pipeline Detection-as-Code":"Το pipeline περιλαμβάνει lint (σύνταξη), δοκιμές με δείγματα logs, staging (μόνο ειδοποίηση, χωρίς ενέργεια) και παραγωγή. Οι μετρικές μετά τη διάθεση (όγκος alerts, ψευδώς θετικά) ελέγχονται πριν προχωρήσει σε όλο το περιβάλλον.","Πρακτικές αξιοπιστίας κανόνων":"Το περιστατικό CrowdStrike (Ιούλιος 2024) έδειξε ότι ένα αρχείο περιεχομένου ανίχνευσης πρέπει να διέρχεται από τις ίδιες πρακτικές με το λογισμικό: δοκιμή, σταδιακή διάθεση (canary), δυνατότητα επαναφοράς και παρακολούθηση.","Προσομοίωση αντιπάλου":"Η επαλήθευση με Atomic Red Team εκτελεί μικρά, ασφαλή τεστ ανά τεχνική. Το αποτέλεσμα είναι διπλό: επιβεβαιώνει ότι ο κανόνας ενεργοποιείται και ότι τα δεδομένα φτάνουν στο SIEM. Ο αποτυχημένος έλεγχος δείχνει κενό στον κανόνα ή στην τηλεμετρία.","MISP: η διαχείριση":"Το MISP οργανώνει τους δείκτες σε events με attributes, tags (TLP, ATT&CK) και galaxies. Η δυνατότητα εξαγωγής σε Suricata/Zeek/STIX το καθιστά κόμβο μεταξύ CTI και ανίχνευσης, ενώ το `to_ids` ξεχωρίζει ό,τι είναι κατάλληλο για αυτόματη ανίχνευση."},add:[["Sigma: ο κοινός ενδιάμεσος",$("Ολοκληρωμένος κανόνας Sigma με ψευδώς θετικά","12.2 Στιγμιότυπο · rules/win_schtasks_programdata.yml","Sigma rule · VS Code",{path:"rules/persistence/win_schtasks_programdata.yml",lines:["title: Scheduled Task Created With Executable In ProgramData","id: 3b7a5c21-6d0e-4d9a-9a3e-52a1f5c2e0b7","status: test","description: Detects schtasks.exe creating a task that runs a binary from C:\\ProgramData","references: [https://attack.mitre.org/techniques/T1053/005/]","author: KS · date: 2026/03/14","logsource: {category: process_creation, product: windows}","detection:","  selection_img: {Image|endswith: '\\schtasks.exe'}","  selection_cli: {CommandLine|contains|all: ['/create', '\\ProgramData\\']}","  condition: selection_img and selection_cli","falsepositives: [Νόμιμοι installers που δημιουργούν εργασίες ενημέρωσης]","level: high","tags: [attack.persistence, attack.t1053.005]"],hi:[6,9,11],notes:["Το **logsource** ορίζει τι δεδομένα απαιτούνται (process_creation στα Windows) — κάθε SIEM το αντιστοιχίζει στην κατάλληλη πηγή (Sysmon 1 ή 4688).","Ο συνδυασμός `/create` **και** `\\ProgramData\\` στη γραμμή εντολών περιορίζει τον κανόνα σε συγκεκριμένη μορφή και μειώνει τον θόρυβο σε σχέση με οποιοδήποτε schtasks.","Το πεδίο **falsepositives** τεκμηριώνει γνωστές εξαιρέσεις εξαρχής, ώστε ο αναλυτής να ξέρει τι να ελέγξει πριν κλιμακώσει."]})],["YARA: ανίχνευση σε αρχεία",$("Εκτέλεση YARA σε αρχείο και σε μνήμη","12.4 Στιγμιότυπο · yara -s","yara 4.5 · rules/svhost32.yar",{path:"yara -s -r rules/svhost32.yar /evidence/extracted/ && vol windows.vadyarascan …",lines:["svhost32_beacon /evidence/extracted/Temp/svhost32.exe","0x1e40:$a: MSIE 6.0","0x3a10:$b: 8B 45 F8 83 C0 3C","0x5b02:$c: cdn.update-check","svhost32_beacon pid.5312.vad.0x1f0000-0x1f9fff.dmp","0x0d02:$c: c.d.n... (wide, UTF-16) cdn.update-check","$ yara -r rules/svhost32.yar /evidence/clean_baseline/ | wc -l","0"],hi:[0,4,7],notes:["Ο κανόνας ταιριάζει στο **εκτελέσιμο του δίσκου** με τρία strings: η συνθήκη «2 of them» ικανοποιείται με περίσσεια.","Ο ίδιος κανόνας ταιριάζει και στο **dump της μνήμης** (VAD), όπου το string είναι wide (UTF-16): επιβεβαίωση ότι το injected PE είναι το ίδιο δείγμα.","Η εκτέλεση σε **καθαρή βάση αναφοράς** δίνει 0 αποτελέσματα: μέτρηση των ψευδώς θετικών πριν τη διάθεση σε παραγωγή."]})],["MISP: η διαχείριση",$("MISP: event με δείκτες και ετικέτες","12.7 Στιγμιότυπο · MISP event 4412","MISP · Event 4412 · «svhost32 / FIN-WS-114»",{path:"https://misp.corp.example/events/view/4412 · TLP:AMBER",tabs:["Attributes (5)","Galaxies","Correlations"],cols:["Category","Type","Value","IDS","Tags"],rows:[["Network activity","ip-dst","198.51.100.44","Ναι","tlp:amber · T1071.001"],["Network activity","domain","cdn.update-check.example","Ναι","tlp:amber · T1568.002"],["Payload delivery","sha256","9be1…d0","Ναι","tlp:amber · T1059.005"],["Network activity","ja3-fingerprint-md5","72a589da586844d7f0818ce684948eea","Όχι","context"],["External analysis","text","Beacon 60 s · TLS self-signed · 10y","Όχι","context"]],hi:[0,3],notes:["Οι δείκτες με **IDS = Ναι** εξάγονται αυτόματα σε Suricata/Zeek. Οι δείκτες πλαισίου (JA3, περιγραφή) παραμένουν ως γνώση χωρίς να προκαλούν alert.","Το **JA3** έχει IDS = Όχι: μπορεί να ανήκει σε νόμιμο λογισμικό με την ίδια βιβλιοθήκη, άρα μόνο του δεν αρκεί για ανίχνευση.","Οι ετικέτες **TLP και ATT&CK** ρυθμίζουν τον διαμοιρασμό και την αντιστοίχιση σε τεχνικές — απαραίτητα για διάθεση σε εταίρους."]})],["Προσομοίωση αντιπάλου",Ae("Purple team: ένας πλήρης κύκλος με Atomic Red Team","12.6 Εμβάθυνση · από τη δοκιμή στη βελτίωση",[["Προετοιμασία","Επιλέγουμε τεχνική από τον Navigator (π.χ. T1053.005) και εγκαθιστούμε το framework σε **απομονωμένο σταθμό εργαστηρίου** με την ίδια τηλεμετρία (Sysmon, EDR, forwarders) με την παραγωγή. Ελέγχουμε τις προαπαιτήσεις (`-CheckPrereqs`) και σημειώνουμε την ώρα έναρξης."],["Εκτέλεση και παρατήρηση","Εκτελούμε το τεστ και ελέγχουμε στο SIEM: (1) έφτασαν τα δεδομένα; (2) ενεργοποιήθηκε ο κανόνας; (3) πόσο χρόνο πήρε; Η απάντηση σε κάθε ερώτημα δείχνει διαφορετικό κενό: **συλλογή**, **λογική κανόνα** ή **καθυστέρηση**."],["Βελτίωση και τεκμηρίωση","Ρυθμίζουμε τον κανόνα ή προσθέτουμε πηγή, ξανατρέχουμε και ενημερώνουμε το Navigator layer (πράσινο = επιβεβαιωμένη κάλυψη). Το τεστ ενσωματώνεται στο CI ώστε να επαναλαμβάνεται σε κάθε αλλαγή κανόνα ή διαμόρφωσης."]],"Στόχος: **κάθε κανόνας να έχει τουλάχιστον ένα αυτοματοποιημένο τεστ**")],["Ποιότητες ενός καλού κανόνα",Ae("Μετρικές μηχανικής ανίχνευσης με παράδειγμα","12.1 Εμβάθυνση · precision, recall και χρόνος",[["Precision (ακρίβεια)","Από 100 alerts του κανόνα, αν 20 ήταν πραγματικά κακόβουλα, το precision είναι 20%. Χαμηλό precision κουράζει τους αναλυτές και μειώνει την εμπιστοσύνη. Στόχος για κανόνες υψηλής προτεραιότητας: **πάνω από 70%** μετά τον συντονισμό."],["Recall (κάλυψη)","Αν σε 10 προσομοιώσεις τεχνικής (Atomic) ο κανόνας πιάνει τις 7, το recall είναι 70%. Το recall μετριέται με **γνωστές θετικές δοκιμές**, όχι με τα alerts της παραγωγής — γιατί οι ανιχνεύσεις που έλειψαν δεν φαίνονται πουθενά."],["Χρόνος ανίχνευσης","Το **MTTD** (μέσος χρόνος ανίχνευσης) εξαρτάται από την καθυστέρηση εισαγωγής και το παράθυρο του κανόνα. Ένας τέλειος κανόνας που ενεργοποιείται 40 λεπτά μετά το γεγονός είναι λιγότερο χρήσιμος από έναν απλούστερο που ειδοποιεί σε 2 λεπτά."]],"Καλός κανόνας = **ακριβής, δοκιμασμένος, γρήγορος και με ιδιοκτήτη**")]]},o2={notes:{"Περιορισμός: η τέχνη του σωστού χρονισμού":"Η βασική ερώτηση είναι «γνωρίζουμε αρκετά για να κόψουμε χωρίς να χάσουμε τον αντίπαλο;». Αν όχι, συνεχίζουμε την οριοθέτηση με αυξημένη παρακολούθηση. Η εξαίρεση είναι όταν υπάρχει ενεργή καταστροφή ή εξαγωγή δεδομένων: τότε ο περιορισμός γίνεται αμέσως.","Πρόωρος έναντι καθυστερημένου":"Και οι δύο επιλογές έχουν κόστος. Η κρίση στηρίζεται σε τρία στοιχεία: ενεργή ζημιά (κρυπτογράφηση, διαρροή), βεβαιότητα οριοθέτησης και ικανότητα ταυτόχρονης εκρίζωσης. Η απόφαση και ο λόγος καταγράφονται στο ημερολόγιο ενεργειών.","Εκρίζωση: μία συντονισμένη κίνηση":"Η εκρίζωση προετοιμάζεται ημέρες πριν: λίστες ενεργειών ανά σύστημα, ρόλοι, εναλλακτικά σχέδια και κριτήρια επιτυχίας. Το «ξήλωμα» σε δόσεις ενημερώνει τον αντίπαλο και του δίνει χρόνο να ενεργοποιήσει εφεδρική επιμονή.","Τι περιλαμβάνει η ημέρα εκρίζωσης":"Στον Active Directory η επαναφορά του **krbtgt** γίνεται **δύο φορές** με ενδιάμεσο χρόνο ίσο με τη διάρκεια ζωής του TGT· έτσι ακυρώνονται και τα τρέχοντα και τα προηγούμενα εισιτήρια. Ακολουθεί επαναφορά κωδικών υπηρεσιών και ανάκληση tokens cloud.","Το χρονοδιάγραμμα της εκρίζωσης":"Η πρόβα (Ημ. −1) είναι κρίσιμη: ελέγχει εντολές, δικαιώματα και εξαρτήσεις υπηρεσιών. Μετά την Ώρα 0 ακολουθεί επαλήθευση με τα ίδια εργαλεία που ανίχνευσαν τον αντίπαλο (SIEM, EDR, Zeek) και όχι μόνο υποθέσεις.","Ανάκαμψη και εντατική επιτήρηση":"Η εντατική επιτήρηση διαρκεί εβδομάδες: watchlist με γνωστούς δείκτες, ειδοποιήσεις για επαναχρησιμοποίηση των παλιών διαπιστευτηρίων και ενισχυμένη καταγραφή. Η επιστροφή στην κανονική λειτουργία εγκρίνεται τυπικά από τον υπεύθυνο του περιστατικού.","Σειρά ανάκαμψης":"Η ταυτότητα (Tier 0) αποκαθίσταται πρώτη γιατί όλα τα άλλα εξαρτώνται από αυτήν. Οι εικόνες επαναφοράς πρέπει να προέρχονται από αντίγραφα **πριν** την παραβίαση και να ελέγχονται για επιμονή πριν συνδεθούν στο δίκτυο.","Τι παρακολουθούμε μετά":"Η watchlist περιλαμβάνει: συνδέσεις παλιών λογαριασμών, οποιαδήποτε επικοινωνία με γνωστή υποδομή, νέους λογαριασμούς διαχειριστή και νέες υπηρεσίες/εργασίες. Ειδοποιήσεις για αυτά τα σήματα έχουν υψηλή προτεραιότητα για 30–90 ημέρες.","Η τελική αναφορά: ένα έγγραφο":"Το ίδιο έγγραφο έχει τρεις όψεις: σύνοψη μίας σελίδας για τη διοίκηση, τεχνική έκθεση με πειστήρια για τους τεχνικούς και νομική ενότητα με χρονισμούς για τις αρχές. Κάθε ισχυρισμός παραπέμπει σε πειστήριο (E-00X) και δηλώνει βεβαιότητα.","Ροή κατασκευής της αναφοράς":"Η αναφορά χτίζεται από τον φάκελο υπόθεσης: η χρονογραμμή από το `forensics`, οι ενέργειες από το `ir-actions`, τα πειστήρια από το μητρώο και οι σημειώσεις από το `notes`. Έτσι η τεκμηρίωση σε πραγματικό χρόνο γίνεται αναφορά χωρίς αναπαράσταση από μνήμης.","Διδάγματα: από την αποτίμηση":"Η ανασκόπηση διεξάγεται χωρίς ενοχοποίηση: ρωτά «τι επέτρεψε να συμβεί» και όχι «ποιος έφταιξε». Τα αποτελέσματα είναι ενέργειες με ιδιοκτήτη, προθεσμία και μετρική επιτυχίας — και παρακολουθούνται ως τεχνικό χρέος.","Ransomware: το δέντρο των δύσκολων":"Το δέντρο αποφάσεων περιλαμβάνει νομικά (κυρώσεις, ασφάλιση), τεχνικά (αντίγραφα, αποκρυπτογράφηση) και επιχειρησιακά ερωτήματα. Η ομάδα DFIR παρέχει τα γεγονότα (τι κρυπτογραφήθηκε, τι διέρρευσε) ώστε η διοίκηση να αποφασίσει σωστά.","Η ροή αποφάσεων στο ransomware":"Η επαλήθευση των αντιγράφων γίνεται νωρίς: υπάρχουν, είναι πρόσφατα, δεν είναι κρυπτογραφημένα, δεν φέρουν επιμονή; Μια ανακάλυψη ότι τα αντίγραφα ήταν επίσης προσβάσιμα και κρυπτογραφημένα αλλάζει ολόκληρη τη στρατηγική.","Επικοινωνία κρίσης: ποιος μαθαίνει":"Προετοιμάζονται πρότυπα μηνυμάτων για εργαζόμενους, πελάτες, ρυθμιστές και μέσα. Η επικοινωνία γίνεται από κανάλι εκτός του παραβιασμένου περιβάλλοντος (π.χ. προσωπικά τηλέφωνα, εναλλακτικό chat) και εγκρίνεται από Νομική.","Αρχές της επικοινωνίας κρίσης":"Ό,τι ανακοινώνεται πρέπει να αντέχει σε μεταγενέστερη έρευνα: γεγονότα με ημερομηνία, ρητή δήλωση για ό,τι δεν είναι γνωστό και δέσμευση για επόμενη ενημέρωση. Οι εικασίες και οι υποσχέσεις που δεν είναι βέβαιες γυρίζουν εναντίον του οργανισμού."},add:[["Το χρονοδιάγραμμα της εκρίζωσης",$("Πίνακας ενεργειών IR (ir-actions tracker)","13.2 Στιγμιότυπο · action tracker","IR Action Tracker · INC-2026-0117",{path:"notes/ir-actions-tracker.csv",cols:["#","Ενέργεια","Ιδιοκτήτης","Ώρα (UTC)","Κατάσταση","Επαλήθευση"],rows:[["1","Απομόνω 06:00. (2) MFA σε όλες τις απομακρυσμένες προσβάσεις.","**Κανονιστικά:** Έγκαιρη προειδοποίηση NIS2 εστάλη 14/03 11:30. Γνωστοποίηση ΓΚΠΔ: δεν απαιτείται (χωρίς ένδειξη διαρροής)."],hi:[2,3,5],notes:["Η **επίπτωση** διατυπώνεται με ρητή βεβαιότητα και τον λόγο που περιορίζει τη βεβαιότητα. Αυτό προστατεύει από υπερβολικές δηλώσεις.","Οι **χρόνοι ανίχνευσης και περιορισμού** δίνουν τις μετρικές MTTD/MTTC που αξιολογεί η διοίκηση και συγκρίνονται με προηγούμενα περιστατικά.","Η αναφορά τελειώνει με **συγκεκριμένες αποφάσεις** που ζητούνται. Ένα έγγραφο χωρίς ερώτημα προς τη διοίκηση δεν δημιουργεί ενέργεια."]})],["Η ροή αποφάσεων στο ransomware",$("Ransomware: τα ίχνη στα logs πριν την κρυπτογράφηση","13.6 Στιγμιότυπο · χρονογραμμή SIEM","SIEM · Timeline · host: FILE-SRV-02",{path:"host.name:FILE-SRV-02 AND (process.command_line:*vssadmin* OR *bcdedit* OR *wevtutil* OR event.code:4663)",cols:["Ώρα (UTC)","Πηγή","Γεγονός","ATT&CK"],rows:[["03:14:02","Sysmon 1","vssadmin delete shadows /all /quiet","T1490"],["03:14:05","Sysmon 1","bcdedit /set {default} recoveryenabled No","T1490"],["03:14:11","Sysmon 1","wevtutil cl Security","T1070.001"],["03:14:20","Security 1102","Το ημερολόγιο Security εκκαθαρίστηκε","T1070.001"],["03:14:31","Sysmon 11","Δημιουργία 12.480 αρχείων *.locked σε 4 λεπτά","T1486"],["03:19:44","Zeek conn","Εξαγωγή 38 GB προς 203.0.113.99:443 (πριν 2 ώρες)","T1567"]],hi:[0,4,5],notes:["Οι εντολές **διαγραφής σκιών και ανάκτησης** προηγούνται της κρυπτογράφησης κατά δευτερόλεπτα — αν υπήρχε ειδοποίηση εδώ, ήταν η τελευταία ευκαιρία περιορισμού.","Η **μαζική δημιουργία αρχείων** (12.480 σε 4 λεπτά) επιβεβαιώνει κρυπτογράφηση σε εξέλιξη. Από εδώ ξεκινά το δέντρο αποφάσεων: άμεση απομόνωση.","Η **εξαγωγή δεδομένων** 2 ώρες νωρίτερα δείχνει διπλή εκβίαση: η επαναφορά από αντίγραφα δεν λύνει το ζήτημα της διαρροής."]})],["Ransomware: το δέντρο των δύσκολων",Ae("Ransomware: η πρώτη ώρα σε πραγματικό χρόνο","13.6 Εμβάθυνση · τι κάνουμε και με ποια σειρά",[["0–15΄ · Απομόνωση","Αποσύνδεση των επηρεασμένων συστημάτων από το δίκτυο (EDR isolation, VLAN, καλώδιο) **χωρίς επανεκκίνηση**. Λήψη μνήμης όπου είναι δυνατό (το κλειδί κρυπτογράφησης μπορεί να βρίσκεται στη RAM). Απενεργοποίηση λογαριασμών που χρησιμοποιήθηκαν και ενεργοποίηση εναλλακτικού καναλιού επικοινωνίας."],["15–40΄ · Εκτίμηση","Ελέγχουμε τα αντίγραφα ασφαλείας (offline, άθικτα;), ποια συστήματα έχουν κρυπτογραφηθεί, αν υπάρχει ένδειξη εξαγωγής δεδομένων και ποιος είναι ο δράστης/οικογένεια (ransom note, επέκταση). Ενημερώνονται Διοίκηση, Νομική και ασφαλιστής."],["40–60΄ · Απόφαση και ξεκίνημα","Η διοίκηση παίρνει αποφάσεις με τεκμηριωμένα στοιχεία: επαναφορά, διαπραγμάτευση, γνωστοποιήσεις. Ξεκινούν οι προετοιμασίες εκρίζωσης (Ώρα 0) και η συλλογή πειστηρίων. Καμία επαφή με δράστες χωρίς Νομική και αρχές."]],"Πρώτος κανόνας: **απομόνωση χωρίς επανεκκίνηση, μνήμη πριν το σβήσιμο**")],["Διδάγματα: από την αποτίμηση",Ae("Μια ανασκόπηση χωρίς ενοχοποίηση (blameless PIR)","13.5 Εμβάθυνση · πώς διεξάγεται",[["Προετοιμασία","Η ανασκόπηση γίνεται 3–10 εργάσιμες μέρες μετά το κλείσιμο, με τη χρονογραμμή έτοιμη από τα πειστήρια. Καλούνται όσοι συμμετείχαν (SOC, IT, Νομική, Επικοινωνία, Διοίκηση) και ένας ουδέτερος συντονιστής που δεν υπήρξε επικεφαλής του περιστατικού."],["Συζήτηση","Ρωτάμε «τι μας επέτρεψε να μην το δούμε νωρίτερα;», «τι καθυστέρησε τον περιορισμό;», «τι λειτούργησε καλά;». Αναζητούμε συστημικούς παράγοντες (διαδικασίες, εργαλεία, εκπαίδευση) και όχι ατομικές ευθύνες. Η ειλικρίνεια εξαρτάται από την ασφάλεια των συμμετεχόντων."],["Αποτέλεσμα","Κάθε εύρημα μετατρέπεται σε ενέργεια με **ιδιοκτήτη, προθεσμία, μετρική επιτυχίας** και παρακολουθείται σε εργαλείο διαχείρισης έργων. Οι μετρικές MTTD/MTTC/MTTR καταγράφονται για σύγκριση με προηγούμενα περιστατικά."]],"Αν οι ενέργειες δεν έχουν ιδιοκτήτη, **η ανασκόπηση δεν έγινε**")]]},Wf=o=>o.h??"";function Et(o,S){const h=o.slides.map(E=>({...E}));for(const[E,C]of Object.entries(S.notes)){const I=h.find(B=>Wf
