* χρονισμός με βάση την οριοθέτηση","**Εκρίζωση:** μία κίνηση, με krbtgt ×2 και όλα τα διαπιστευτήρια","**Ανάκαμψη:** ταυτότητα πρώτα, watchlist και επιτήρηση","**Αναφορά:** ένα έγγραφο, τρία ακροατήρια","**PIR:** ενέργειες με ιδιοκτήτη, προθεσμία, μετρική","**Ransomware/κρίση:** τεκμηριωμένες αποφάσεις, μία φωνή"]),t1("Ανίχνευσε. Αποκρίσου. Και τεκμηρίωσε ό,τι έκανες — γιατί αυτό που δεν τεκμηριώθηκε, δεν έγινε.","Ολοκλήρωση του μαθήματος","Ψηφιακή Εγκληματολογία και Αντιμετώπιση Περιστατικών · Ιόνιο Πανεπιστήμιο"),A("Η διαδρομή DFIR: τι κερδίσατε και πού συνεχίζετε","Ολοκλήρωση · Κεφάλαια 1–13",["**Επίπεδο 1:** DFIR, πειστήρια, μοντέλα απειλών","**Επίπεδο 2:** NTFS/Μητρώο, τεκμήρια εκτέλεσης, Sysmon, μνήμη","**Επίπεδο 3:** υπηρεσίες, Zeek, Suricata","**Επίπεδο 4:** SIEM, μηχανική ανίχνευσης, περιορισμός και αναφορά","Επόμενα βήματα: **ασκήσεις tabletop, purple team, δημοσίευση διδαγμάτων**"],["13","κεφάλαια · 4 επίπεδα · 1 μέθοδος"])]),Jm={notes:{"Τι είναι το DFIR;":"Στην πράξη το ίδιο περιστατικό απαιτεί και τα δύο σκέλη: ο ερευνητής IR σταματά την αιμορραγία (π.χ. απομονώνει έναν σταθμό), ενώ ο εγκληματολόγος φροντίζει να έχει αποτυπωθεί η μνήμη και ο δίσκος **πριν** από αυτή την ενέργεια. Η ένταση «γρήγορα» εναντίον «σωστά» λύνεται με προκαθορισμένες διαδικασίες συλλογής, όχι με αυτοσχεδιασμό.","Εγκληματολογία έναντι":"Παράδειγμα: σταθμός με ransomware σε εξέλιξη. Η IR ομάδα θέλει άμεση αποσύνδεση· η εγκληματολογία ζητά 10 λεπτά για λήψη μνήμης. Το σχέδιο απόκρισης πρέπει να ορίζει ποιος αποφασίζει και πότε υπερισχύει η ταχύτητα (π.χ. όταν κρυπτογραφούνται ενεργά αρχεία, ο περιορισμός προηγείται).","Οι πηγές πειστηρίων":"Κάθε πηγή απαντά διαφορετικό ερώτημα: ο δίσκος λέει τι υπήρξε, η μνήμη τι τρέχει τώρα, τα logs ποιος έκανε τι και πότε, το δίκτυο με ποιον μίλησε το σύστημα. Ένα ισχυρό συμπέρασμα στηρίζεται σε τουλάχιστον δύο ανεξάρτητες πηγές, ώστε να αντέχει στην αντεξέταση.","Γιατί έχει σημασία η ταχύτητα":"Οι αριθμοί προέρχονται από ετήσιες εκθέσεις (IBM Cost of a Data Breach, Mandiant M-Trends, Verizon DBIR) και αλλάζουν κάθε χρονιά. Το σταθερό μήνυμα: όσο νωρίτερα ανιχνεύεται και περιορίζεται μια παραβίαση, τόσο μικρότερο το κόστος. Η μείωση του χρόνου παραμονής του αντιπάλου είναι η πιο αποδοτική επένδυση ενός SOC.","Η διαδρομή ενός περιστατικού":"Η διαδρομή δεν είναι ευθεία: μια νέα ένδειξη στην οριοθέτηση μπορεί να επιστρέψει την ομάδα στη διαλογή. Το ουσιώδες είναι ότι κάθε μετάβαση καταγράφεται με ώρα UTC, ώστε η αναφορά να μπορεί να αποδείξει πότε ανιχνεύθηκε, πότε περιορίστηκε και πότε επανήλθε η λειτουργία.","Ο κύκλος του NIST":"Το NIST SP 800-61 περιγράφει κύκλο και όχι γραμμή: τα διδάγματα της τελευταίας φάσης τροφοδοτούν ξανά την προετοιμασία (νέες ανιχνεύσεις, νέα εγχειρίδια, νέα εκπαίδευση). Οι οργανισμοί που παραλείπουν την 4η φάση ξαναζούν το ίδιο περιστατικό με άλλο όνομα.","Γιατί οι τρεις ενέργειες":"Η ομαδοποίηση περιορισμού–εξάλειψης–ανάκαμψης είναι συνειδητή επιλογή του NIST: αν καθαρίσεις πριν οριοθετήσεις, θα χάσεις πειστήρια και ο αντίπαλος θα επιστρέψει από άλλη πόρτα. Γι' αυτό οι αποφάσεις περιορισμού λαμβάνονται με βάση την εικόνα του εύρους, όχι με βάση την πίεση της στιγμής.","Οι βαθμίδες του SOC":"Το μοντέλο βαθμίδων δεν είναι ιεραρχία κύρους αλλά ρύθμιση εργασίας: το Tier 1 απορροφά τον όγκο, το Tier 2 βαθαίνει τις έρευνες και το Tier 3 μετατρέπει τα ευρήματα σε νέες ανιχνεύσεις. Σε μικρούς οργανισμούς ένας άνθρωπος καλύπτει και τους τρεις ρόλους — οι διαδικασίες όμως παραμένουν ξεχωριστές.","Το οικοσύστημα γύρω από το SOC":"Κανένα εργαλείο δεν αρκεί μόνο του: το EDR βλέπει το τερματικό, το NDR το δίκτυο, το SIEM τα συσχετίζει και το SOAR αυτοματοποιεί τα επαναλαμβανόμενα βήματα. Η αξία εμφανίζεται στις **ενώσεις** μεταξύ τους — γι' αυτό η κανονικοποίηση δεδομένων και τα κοινά αναγνωριστικά αναλύονται στα επόμενα κεφάλαια.","Πότε κλιμακώνουμε":"Μια καλή κλιμάκωση δεν είναι μεταφορά ευθύνης αλλά μεταφορά **γνώσης**: ο Tier 1 παραδίδει το τι είδε, τι έλεγξε ήδη, ποια υπόθεση έχει και ποια πειστήρια έχουν φυλαχτεί. Το Tier 2 δεν πρέπει να ξαναρχίζει από το μηδέν.","Τα βήματα της διαλογής":"Η διαλογή λειτουργεί σαν ιατρική τριάζ: με περιορισμένη πληροφορία και χρόνο, ο αναλυτής επιλέγει ποιος ασθενής χρειάζεται πρώτα δράση. Η τεκμηρίωση του **λόγου** της απόφασης είναι εξίσου σημαντική με την ίδια την απόφαση, γιατί κρίνεται εκ των υστέρων.","Παραδεκτότητα ψηφιακών":"Στα δικαστήρια η ψηφιακή απόδειξη δεν αμφισβητείται κυρίως τεχνικά αλλά διαδικαστικά: ποιος τη συνέλεξε, με ποια εξουσιοδότηση, πώς φυλάχθηκε, ποιο hash είχε. Ένα τεχνικά ορθό εύρημα με κενό στην αλυσίδα επιμέλειας μπορεί να απορριφθεί.","Οι τρεις πειθαρχίες":"Οι τρεις πειθαρχίες λειτουργούν προληπτικά: εξουσιοδότηση πριν τη συλλογή, ελαχιστοποίηση δεδομένων κατά τη συλλογή, τεκμηρίωση μετά. Έτσι ο ερευνητής προστατεύει τον οργανισμό και τον εαυτό του από νομικές συνέπειες, ιδίως όταν εμπλέκονται προσωπικά δεδομένα εργαζομένων.","Η έρευνα ως εφαρμοσμένη":"Παράδειγμα: υπόθεση «ο λογαριασμός παραβιάστηκε μέσω phishing». Αν ισχύει, θα υπάρχει μήνυμα στο αρχείο αλληλογραφίας, σύνδεση από ασυνήθιστη IP και εκτέλεση συνημμένου. Αν κανένα δεν βρεθεί, η υπόθεση διαψεύδεται και ο χώρος των εξηγήσεων στενεύει — αυτό είναι πρόοδος, όχι αποτυχία.","Έξι στοιχεία ετοιμότητας":"Καθένα από τα έξι στοιχεία κοστίζει λίγο πριν το περιστατικό και εξοικονομεί ημέρες μετά. Χωρίς NTP οι χρονογραμμές δεν συμφωνούν· χωρίς επαρκή διατήρηση, τα logs έχουν ήδη αντικατασταθεί όταν ξεκινά η έρευνα· χωρίς έτοιμα εργαλεία, χάνεται πολύτιμος χρόνος σε εγκαταστάσεις.","Δέσμευση διατήρησης":"Το litigation hold είναι νομικό εργαλείο με άμεση τεχνική συνέπεια: σταματά τους αυτόματους κύκλους διαγραφής (email, logs, αντίγραφα). Ο ερευνητής πρέπει να γνωρίζει ποια συστήματα διαγράφουν αυτόματα και να ζητά ενεργοποίηση του hold από τη Νομική χωρίς καθυστέρηση.","Το ρολόι των προθεσμιών":"Το ρολόι ξεκινά όταν ο οργανισμός **λαμβάνει γνώση**, όχι όταν ολοκληρώνεται η ανάλυση. Γι' αυτό η πρώτη προειδοποίηση των 24 ωρών στέλνεται με ελλιπή στοιχεία και συμπληρώνεται. Η ομάδα IR οφείλει να παράγει γρήγορα ένα πρώτο σύνολο γεγονότων που μπορεί να χρησιμοποιήσει η Νομική."},add:[["Τα βήματα της διαλογής",$("Η ουρά ειδοποιήσεων του Tier 1","1.4 Στιγμιότυπο · SIEM","SIEM · Alert Queue",{path:"https://siem.corp.example/alerts?status=open",tabs:["Ανοιχτά (6)","Σε έρευνα","Κλειστά"],cols:["Ώρα (UTC)","SEV","Κανόνας","Σταθμός","Χρήστης","Κατάσταση"],rows:[["09:02:11","SEV-4","Failed logon ×3","HR-WS-021","mpapas","Νέο"],["09:04:37","SEV-3","New scheduled task","FIN-WS-114","ntsakos","Νέο"],["09:07:02","SEV-2","DNS burst, name > 60 chars","FIN-WS-114","ntsakos","Νέο"],["09:11:50","SEV-4","USB storage inserted","ENG-WS-007","kdimou","Νέο"],["09:15:19","SEV-3","Rare parent → powershell","FIN-WS-114","ntsakos","Νέο"],["09:21:44","SEV-4","Policy: file-sharing site","MKT-WS-033","eioan","Νέο"]],hi:[2,4,1],detail:[["Σταθμός","FIN-WS-114"],["Κρισιμότητα asset","Υψηλή (Οικονομικό)"],["Ειδοποιήσεις 24h","3 από τον ίδιο σταθμό"],["Προτεινόμενο","SEV-2 → Tier 2"]],notes:["Η ειδοποίηση **DNS burst** έχει τη χαμηλότερη «βαθμολογία» κανόνα αλλά τον πιο ύποπτο συνδυασμό: πολύ μακριά ονόματα είναι συχνό σημάδι DNS tunneling.","Η ίδια οικονομική μονάδα έχει **τρεις** διαφορετικές ειδοποιήσεις μέσα σε 20 λεπτά. Μεμονωμένα είναι SEV-3/4, μαζί σχηματίζουν αλυσίδα.","Ο Tier 1 δεν κλείνει την υπόθεση ως «θόρυβο»· ομαδοποιεί ανά σταθμό, ανεβάζει σε SEV-2 και κλιμακώνει με το πλαίσιο που έχει ήδη συγκεντρώσει."]})],["Τα βήματα της διαλογής",$("Το ημερολόγιο ενεργειών της υπόθεσης","1.8 Στιγμιότυπο · notes/actions.log","actions.log · INC-2026-0117",{path:"~/cases/INC-2026-0117/notes/actions.log",lines:["2026-03-14T09:12:05Z | K.S. | OPEN | INC-2026-0117 · κλιμάκωση από Tier 1, SIEM #88231","2026-03-14T09:14:41Z | K.S. | NOTE | Υπόθεση Η1: beaconing DNS από FIN-WS-114 (πιθανό C2)","2026-03-14T09:18:03Z | K.S. | ASK  | Νομική: εξουσιοδότηση για λήψη μνήμης και δίσκου","2026-03-14T09:31:27Z | K.S. | ACQ  | Μνήμη → E-002 · sha256=4be9c1…7a22","2026-03-14T09:52:10Z | K.S. | ACT  | Απομόνωση EDR FIN-WS-114 [ΑΛΛΑΖΕΙ ΤΟ ΣΥΣΤΗΜΑ]","2026-03-14T10:05:00Z | K.S. | CUST | E-003 σφραγίδα S-88231 → Εργαστήριο, θυρίδα Β2","2026-03-14T10:44:19Z | K.S. | NOTE | Η1 επιβεβαιώνεται: beacon 60 s προς 198.51.100.44:443","2026-03-14T11:02:44Z | K.S. | ACT  | Μπλοκ C2 στο firewall [ΑΛΛΑΖΕΙ ΤΟ ΣΥΣΤΗΜΑ]"],hi:[3,4,5],notes:["Η **λήψη μνήμης** προηγείται της απομόνωσης (γραμμές 4 και 5): πρώτα το πτητικό πειστήριο, μετά η ενέργεια που το αλλοιώνει. Η σειρά φαίνεται μέσα στο ίδιο το log.","Οι ενέργειες που **αλλάζουν** το σύστημα επισημαίνονται ρητά ([ΑΛΛΑΖΕΙ ΤΟ ΣΥΣΤΗΜΑ]) ώστε να διακρίνονται από την παρατήρηση.","Η αλυσίδα επιμέλειας (γραμμή 6) αναφέρει σφραγίδα και θέση φύλαξης. Χωρίς αυτήν, η εικόνα δίσκου δεν έχει αποδεικτική αξία."]})],["Παραδεκτότητα ψηφιακών",Ae("Πώς μοιάζει μια καλή κλιμάκωση Tier 1 → Tier 2","1.3 Εμβάθυνση · παράδοση υπόθεσης",[["Τι γράφω","Ένα σύντομο σημείωμα με **ποιος** (χρήστης, σταθμός), **τι** (κανόνες που ενεργοποιήθηκαν, ώρες UTC), **γιατί** το θεωρώ ύποπτο και **πόσο βέβαιος** είμαι. Χρησιμοποιώ γεγονότα και όχι εικασίες: «τρεις ειδοποιήσεις σε 20΄» και όχι «κάτι περίεργο συμβαίνει»."],["Τι επισυνάπτω","Τα αρχικά συμβάντα ως έχουν (εξαγωγή JSON/EVTX), στιγμιότυπα του SIEM, το ιστορικό του σταθμού και του χρήστη και, αν υπάρχουν, τα αποτελέσματα εμπλουτισμού (φήμη IP, κρισιμότητα asset). Ο Tier 2 πρέπει να μπορεί να συνεχίσει χωρίς να ρωτήσει ξανά τίποτα."],["Τι δεν κάνω","Δεν επανεκκινώ, δεν σβήνω, δεν «καθαρίζω» και δεν εκτελώ εργαλεία στον σταθμό πριν καταγραφεί η ενέργεια. Δεν αγγίζω τα πειστήρια πέρα από τα εγκεκριμένα βήματα του εγχειριδίου. Αν αμφιβάλλω, κλιμακώνω νωρίτερα — η κλιμάκωση δεν είναι αποτυχία."]],"Κριτήριο ποιότητας: ο Tier 2 ξεκινά την έρευνα σε **λιγότερο από 5 λεπτά** από την παραλαβή")],["Το ρολόι των προθεσμιών",Ae("ΓΚΠΔ και NIS2 σε πραγματικό περιστατικό","1.5 Εμβάθυνση · ποιος ειδοποιείται και πότε",[["Ώρα 0: γνώση","Ο οργανισμός **λαμβάνει γνώση** όταν υπάρχει εύλογη βεβαιότητα ότι συνέβη παραβίαση προσωπικών δεδομένων ή σημαντικό περιστατικό — όχι όταν ολοκληρωθεί η έρευνα. Η πρώτη επιβεβαίωση από αναλυτή SOC συνήθως ξεκινά το ρολόι, και πρέπει να καταγραφεί με ακριβή ώρα UTC."],["24 και 72 ώρες","Η NIS2 ζητά **έγκαιρη προειδοποίηση εντός 24 ωρών** (με ένδειξη αν υπάρχει υποψία κακόβουλης ενέργειας) και **γνωστοποίηση εντός 72 ωρών** με αρχική αξιολόγηση. Ο ΓΚΠΔ ζητά ειδοποίηση της εποπτικής αρχής εντός 72 ωρών, εκτός αν η παραβίαση δεν συνεπάγεται κίνδυνο."],["Τελική αναφορά","Εντός ενός μήνα από τη γνωστοποίηση η NIS2 απαιτεί **τελική αναφορά** με βασική αιτία, μέτρα περιορισμού και διασυνοριακές επιπτώσεις. Τα στοιχεία αυτά προέρχονται απευθείας από τον φάκελο υπόθεσης: χρονογραμμή, εύρος, ευρήματα και ενέργειες."],["Ρόλος του DFIR","Ο ερευνητής δεν αποφασίζει τι θα γνωστοποιηθεί (αυτό ανήκει στη Νομική/DPO), αλλά **παρέχει γρήγορα και με βεβαιότητα** τα γεγονότα: ποια δεδομένα, πόσα άτομα, από πότε, αν έγινε εξαγωγή. Ανακριβείς πρώτες πληροφορίες δημιουργούν προβλήματα αργότερα."]],"Πρακτικός κανόνας: συμπλήρωση των γεγονότων **με ενημερώσεις**, όχι αναμονή για πλήρη εικόνα")],["Έξι στοιχεία ετοιμότητας",$("Το έντυπο μεταβίβασης πειστηρίου","1.7 Στιγμιότυπο · Chain of Custody","Evidence Register · INC-2026-0117",{path:"evidence/register.csv",cols:["Item","Περιγραφή","SHA-256 (αρχή)","Από → Προς","Ώρα (UTC)","Θέση"],rows:[["E-001","Ειδοποίηση SIEM #88231 (JSON)","a41f9c…","SIEM → K.S.","09:12:05","evidence/logs"],["E-002","Μνήμη FIN-WS-114 (16 GB)","4be9c1…","K.S. → K.S.","09:31:27","evidence/memory"],["E-003","Δίσκος SATA 500 GB S/N ZA…","7e9b02…","Πελάτης → K.S.","10:05:00","Θυρίδα Β2"],["E-003a","Εικόνα raw του E-003","7e9b02…","K.S. → Αρχείο","11:48:12","evidence/disk"],["E-004","Τηλεμετρία Sysmon (evtx)","c02d77…","SIEM → K.S.","12:20:41","evidence/logs"]],hi:[2,3],notes:["Ο φυσικός δίσκος **E-003** έχει σφραγίδα και θέση φύλαξης. Είναι το μόνο αντικείμενο που αλλάζει χέρια εκτός του υπολογιστή του ερευνητή.","Η εικόνα **E-003a** έχει το ίδιο hash με το πρωτότυπο: αυτή είναι η απόδειξη ότι το αντίγραφο εργασίας ταυτίζεται με το μέσο-πειστήριο.","Το μητρώο κρατά **ένα** αναγνωριστικό ανά αντικείμενο. Κάθε παράγωγο (εικόνα, εξαγωγή) παίρνει νέο υπο-αναγνωριστικό και δικό του hash."]})]]},Wm={notes:{"Συλλέγουμε πρώτα ό,τι χάνεται πρώτο":"Το RFC 3227 («Guidelines for Evidence Collection and Archiving») δεν είναι εργαλείο αλλά σκεπτικό: κάθε δεδομένο έχει «διάρκεια ζωής» και ο ερευνητής ιεραρχεί με βάση το τι θα χαθεί πρώτο. Ένας κλασικός λάθος είναι να ξεκινά κανείς με την εικόνα δίσκου ενώ η μνήμη με τα κλειδιά και τις συνδέσεις ακόμη τρέχει.","Η σειρά πτητικότητας":"Στην πράξη οι πρώτες δύο βαθμίδες (καταχωρητές, cache) δεν συλλέγονται. Η πρακτική αρχή είναι: **μνήμη και δικτυακή κατάσταση → προσωρινά αρχεία → δίσκος → απομακρυσμένα logs → αρχείο**. Τα απομακρυσμένα logs συχνά είναι τα πιο αξιόπιστα, γιατί ο αντίπαλος δεν μπορεί να τα αλλοιώσει από τον υπολογιστή που κατέλαβε.","Πόσο ζει ένα πειστήριο":"Οι τιμές είναι ενδεικτικές και εξαρτώνται από τη ρύθμιση: ένα Security log 20 MB σε πολυσύχναστο DC μπορεί να «κυλήσει» σε λίγες ώρες. Γι' αυτό μεταφέρουμε τα logs σε κεντρικό σύστημα και γνωρίζουμε εκ των προτέρων το βάθος διατήρησης κάθε πηγής.","Τέσσερις κανόνες της συλλογής":"Η αρχή της ελάχιστης αλλοίωσης είναι πάντα συμβιβασμός: για να πάρεις μνήμη πρέπει να τρέξεις κάτι στο σύστημα. Ο κανόνας είναι να χρησιμοποιείς αξιόπιστα, εξωτερικά εργαλεία, να ξέρεις τι αλλάζουν και να **καταγράφεις** ότι το έκανες.","Φραγή εγγραφής: το πρώτο τείχος":"Ένας δίσκος NTFS που συνδέεται σε Windows χωρίς φραγή μπορεί να ενημερωθεί αυτόματα (ευρετηρίαση, ανάκτηση από πρόσφατη διακοπή, μεταδεδομένα). Ακόμη και ένα «αθώο» άνοιγμα αλλάζει bytes — και ο δικηγόρος της άλλης πλευράς θα ρωτήσει.","Φραγή υλικού έναντι λογισμικού":"Η φραγή υλικού είναι ανεξάρτητη από το ΛΣ και εύκολα αποδεικνύεται στο δικαστήριο. Η φραγή λογισμικού είναι αποδεκτή όταν δεν υπάρχει υλικό, με την προϋπόθεση ότι **επαληθεύεται και καταγράφεται** πριν από κάθε απεικόνιση (blockdev --getro).","Διαδικασία σύνδεσης δίσκου":"Η φωτογράφηση πριν από τη σύνδεση αποδεικνύει την κατάσταση του μέσου (σφραγίδες, ετικέτες, φθορές). Η σειρά «δίσκος → blocker → σταθμός» δεν είναι τυχαία: αν ανάψει πρώτα ο σταθμός με συνδεδεμένο δίσκο χωρίς blocker, το ΛΣ μπορεί να τον προσαρτήσει σε λειτουργία εγγραφής.","Τι είναι μια εγκληματολογική εικόνα":"Η εικόνα αντιγράφει **κάθε τομέα**, και όχι μόνο τα ορατά αρχεία: αχρησιμοποίητο χώρο, διαγραμμένα αρχεία, slack space, κρυμμένα διαμερίσματα. Γι' αυτό η απλή αντιγραφή αρχείων (copy/paste) ή το «Clone» δίσκου χωρίς έλεγχο δεν αποτελεί εγκληματολογική εικόνα.","raw, E01 και AFF4":"Η επιλογή μορφής είναι θέμα λειτουργικότητας: raw για μέγιστη συμβατότητα με κάθε εργαλείο, E01 όταν θέλεις συμπίεση και ενσωματωμένα μεταδεδομένα υπόθεσης, AFF4 σε πολύ μεγάλους όγκους ή όταν συλλέγεις πολλαπλές πηγές (δίσκος + μνήμη) σε ένα κοντέινερ.","Οι αριθμοί μιας απεικόνισης":"Ο χρόνος απεικόνισης = μέγεθος / ρυθμός ανάγνωσης. 500 GB με 150 MB/s ≈ 55 λεπτά, όμως ένας φθαρμένος δίσκος με επαναλαμβανόμενα σφάλματα ανάγνωσης μπορεί να πάρει πολλαπλάσιο χρόνο. Ο προγραμματισμός του περιστατικού πρέπει να τον περιλαμβάνει.","Το δακτυλικό αποτύπωμα των δεδομένων":"Το hash αποδεικνύει **ακεραιότητα** («δεν άλλαξε τίποτα μεταξύ δύο σημείων») αλλά όχι **αυθεντικότητα** («προέρχεται πράγματι από το σύστημα Χ»). Η αυθεντικότητα προκύπτει από την αλυσίδα επιμέλειας και την τεκμηρίωση της συλλογής.","MD5/SHA-1 έναντι SHA-256":"Το 2017 η ομάδα CWI/Google παρήγαγε την πρώτη πρακτική σύγκρουση SHA-1 (SHAttered). Για την ταυτοποίηση αρχείων που έχουν ήδη συλλεχθεί ο MD5 παραμένει χρήσιμος για συμβατότητα με βάσεις, αλλά για αποδεικτική ακεραιότητα καταγράφουμε πάντα και **SHA-256**.","Ο βρόχος επαλήθευσης":"Ο βρόχος κλείνει με σύγκριση: hash πηγής = hash εικόνας. Αν διαφέρουν, δεν συνεχίζουμε ανάλυση αλλά ερευνούμε την αιτία (κακά sectors, διακοπή, σφάλμα εργαλείου) και επαναλαμβάνουμε. Το ίδιο hash ξανα-υπολογίζεται και πριν την παράδοση στο δικαστήριο.","Ποιος είχε το πειστήριο":"Η αλυσίδα επιμέλειας είναι νομική έννοια με τεχνική υποστήριξη: υπογραφές, ώρες, σφραγίδες. Στην πράξη κάθε μεταβίβαση παίρνει μία γραμμή στο έντυπο και μία νέα σφραγίδα. Ένα κενό μερικών ωρών αρκεί για να αμφισβητηθεί η ακεραιότητα του πειστηρίου.","Η ζωή ενός πειστηρίου":"Οι πέντε φάσεις ισχύουν και για ψηφιακά αντικείμενα: ακόμη και ένα αρχείο εικόνας σε δίσκο δικτύου χρειάζεται καταγραφή ποιος έχει πρόσβαση, πότε τη χρησιμοποίησε και ποια αντίγραφα εργασίας δημιούργησε.","Τι σπάει την αλυσίδα":"Τα συχνότερα λάθη είναι ανθρώπινα, όχι τεχνικά: μια υπογραφή που λείπει, ένας δίσκος που έμεινε στο γραφείο για ένα βράδυ, μια ώρα που γράφτηκε σε τοπική ζώνη. Γι' αυτό τα έντυπα και οι διαδικασίες είναι ρυθμισμένα ώστε να μην αφήνουν περιθώριο αυτοσχεδιασμού.","Ζωντανή ή νεκρή απόκτηση":"Ο κανόνας απόφασης: αν το σύστημα είναι **ξεκλείδωτο** και έχει κρυπτογράφηση δίσκου, η ζωντανή απόκτηση είναι η μόνη ευκαιρία να πάρεις κλειδιά και δεδομένα· αν είναι κλειδωμένο/σβηστό, η νεκρή απόκτηση με blocker είναι καθαρότερη. Η απόφαση και το σκεπτικό γράφονται στο ημερολόγιο.","Πλεονεκτήματα και κίνδυνοι":"Το «πρώτα live, μετά dead» ισχύει όπου είναι δυνατό: συλλέγεις RAM και κατάσταση δικτύου, και μετά απεικονίζεις τον δίσκο. Έτσι κρατάς τα πτητικά και έχεις και καθαρό αντίγραφο δίσκου.","BitLocker: πού βρίσκεται":"Το κλειδί ανάκτησης BitLocker συχνά υπάρχει στον Active Directory ή στον λογαριασμό Microsoft του χρήστη. Αν ο τόμος είναι ξεκλείδωτος, το κλειδί τόμου (FVEK) βρίσκεται και στη RAM — γι' αυτό η λήψη μνήμης προηγείται πριν κλείσει το μηχάνημα.","SSD: όταν το υλικολογισμικό":"Σε SSD, ο ελεγκτής μπορεί να μηδενίσει μπλοκ διαγραμμένων αρχείων μόνος του, ακόμη και με blocker. Αυτό σημαίνει ότι η ανάκτηση διαγραμμένων αρχείων μειώνεται με τον χρόνο· η συλλογή οφείλει να γίνει όσο το δυνατόν νωρίτερα και να καταγραφεί η κατάσταση (συνδεδεμένος, ενεργοποιημένο TRIM).","Νέες επιφάνειες πειστηρίων":"Στο νέφος και στα κοντέινερ το «σύστημα» μπορεί να μην υπάρχει πια όταν ξεκινά η έρευνα. Γι' αυτό η ετοιμότητα περιλαμβάνει προ-ρυθμισμένες πολιτικές snapshot και ρόλους ανάγνωσης, ώστε η συλλογή να γίνεται με API πριν από τη διαγραφή του πόρου.","Εγκληματολογικό snapshot":"Το snapshot μεταφέρεται σε **ξεχωριστό λογαριασμό εγκληματολογίας** ώστε να μην επηρεάζεται από ενέργειες του δράστη στον παραβιασμένο λογαριασμό. Κάθε βήμα (id snapshot, ώρα, hash) καταγράφεται όπως σε φυσικό μέσο.","Ασαφής κατακερματισμός":"Το ssdeep χωρίζει το αρχείο σε τμήματα και συγκρίνει τα «ίχνη» ώστε να δείξει ομοιότητα (π.χ. 87%). Χρησιμοποιείται για ομαδοποίηση παραλλαγών του ίδιου malware, όχι ως απόδειξη ακεραιότητας.","Ανάκτηση και πρακτική κατάσχεσης":"Η ανάκτηση με file carving βασίζεται στις υπογραφές αρχείων (π.χ. FF D8 FF για JPEG) και μπορεί να βρει αρχεία χωρίς πίνακα αρχείων, αλλά χάνει ονόματα και χρονοσφραγίδες. Χρησιμοποιείται όταν το σύστημα αρχείων είναι φθαρμένο ή τα μεταδεδομένα διαγράφηκαν."},add:[["Επαλήθευση φραγής εγγραφής σε Linux",$("Το log του dc3dd μετά την απεικόνιση","2.9 Στιγμιότυπο · E-003-dc3dd.log","dc3dd · Log αρχείο",{path:"evidence/disk/E-003-dc3dd.log",lines:["dc3dd 7.2.646 started at 2026-03-14 10:51:07 +0000","compiled options: command line: dc3dd if=/dev/sdb of=E-003.raw hash=md5 hash=sha256 log=E-003-dc3dd.log","device size: 976773168 sectors (probed), 500,107,862,016 bytes","sector size: 512 bytes (probed)","  500107862016 bytes ( 466 G ) copied ( 100% ), 3187 s, 150 M/s","input results for device `/dev/sdb':","   976773168 sectors in","   0 bad sectors replaced by zeros","   3c1d5a02b9e04f7710aa62c3d8f0b108 (md5)","   7e9b02f1c4a3d8e56b9017f2a4c6de89 1d2f… (sha256)","output results for file `E-003.raw':","   976773168 sectors out","dc3dd completed at 2026-03-14 11:44:14 +0000"],hi:[6,8,9],notes:["**sectors in = sectors out** και **0 bad sectors**: το αντίγραφο είναι πλήρες. Οποιαδήποτε άλλη τιμή απαιτεί εξήγηση και καταγραφή.","Τα δύο hash παράγονται **κατά την ανάγνωση**, όχι μετά. Έτσι δεν χρειάζεται δεύτερο πέρασμα και δεν υπάρχει περιθώριο αλλοίωσης ανάμεσα.","Το log φυλάσσεται δίπλα στην εικόνα και γίνεται το πρώτο παραδοτέο του έντυπου. Ώρες έναρξης/λήξης και εντολή είναι μέρος της απόδειξης."]})],["Οι αριθμοί μιας απεικόνισης",$("Μεταδεδομένα της εικόνας E01","2.9 Στιγμιότυπο · ewfinfo","ewfinfo E-003.E01",{path:"evidence/disk/E-003.E01",lines:["ewfinfo 20240506","Acquiry information","    Case number:            INC-2026-0117","    Evidence number:        E-003","    Examiner name:          K. Karagiannis","    Acquisition date:       Sat Mar 14 10:52:09 2026","    System date:            Sat Mar 14 10:52:09 2026","    Operating system used:  Linux","    Software version used:  20240506","    Compression type:       fast","Media information","    Media size:             466 GiB (500107862016 bytes)","    Bytes per sector:       512","Digest hash information","    MD5:                    3c1d5a02b9e04f7710aa62c3d8f0b108","    SHA256:                 7e9b02f1c4a3d8e56b90…"],hi:[2,5,14],notes:["Το E01 **ενσωματώνει** υπόθεση, πειστήριο και εξεταστή στο ίδιο το αρχείο. Έτσι η ταυτότητα του πειστηρίου ταξιδεύει μαζί με τα δεδομένα.","Η ημερομηνία απόκτησης πρέπει να συμφωνεί με το ημερολόγιο ενεργειών και το έντυπο επιμέλειας. Διαφορά ζώνης ώρας είναι κλασικό σημείο αμφισβήτησης.","Τα hash του E01 πρέπει να ταυτίζονται με του raw: `ewfverify` τα ελέγχει ξανά από την αρχή, μπλοκ προς μπλοκ (CRC)."]})],["MD5/SHA-1 έναντι SHA-256",Ae("Γιατί δεν αρκεί ο MD5: δύο πραγματικές περιπτώσεις","2.4 Εμβάθυνση · σπασμένοι αλγόριθμοι",[["Flame (2012)","Το κακόβουλο Flame χρησιμοποίησε **σύγκρουση MD5 επιλεγμένου προθέματος** για να πλαστογραφήσει πιστοποιητικό υπογραφής κώδικα που έμοιαζε να έχει εκδοθεί από τη Microsoft και να διανεμηθεί μέσω Windows Update. Το γεγονός έκανε σαφές ότι ο MD5 δεν πρέπει να προστατεύει τίποτα που έχει αξία."],["SHAttered (2017)","Ερευνητές του CWI Amsterdam και της Google παρήγαγαν δύο **διαφορετικά PDF με ίδιο SHA-1**. Η επίθεση κόστισε περίπου 9,2 × 10¹⁸ υπολογισμούς SHA-1 — μεγάλη, αλλά εφικτή για κρατικούς και μεγάλους δρώντες. Από τότε ο SHA-1 θεωρείται ακατάλληλος για ακεραιότητα."],["Τι σημαίνει για το DFIR","Ένας αντίδικος θα μπορούσε θεωρητικά να ισχυριστεί ότι δύο διαφορετικά αντικείμενα έχουν το ίδιο MD5. Γι' αυτό υπολογίζουμε **και SHA-256** και τα καταγράφουμε μαζί. Τα MD5/SHA-1 μένουν για συμβατότητα με βάσεις δειγμάτων (VirusTotal, NSRL), όχι για απόδειξη."]],"Κανόνας εργασίας: **SHA-256 ως βασικό hash, MD5 μόνο ως δευτερεύον**")],["BitLocker: πού βρίσκεται",Ae("Απόφαση ζωντανής απόκτησης με BitLocker","2.6 Εμβάθυνση · δέντρο αποφάσεων",[["Είναι ξεκλείδωτο;","Αν ο τόμος είναι ήδη ξεκλείδωτος, η αποκρυπτογράφηση γίνεται από το ΛΣ και **δεν χρειάζεται** κωδικός. Το πρώτο βήμα είναι λήψη μνήμης (περιέχει το κλειδί τόμου), και έπειτα λογική εικόνα του τόμου ή εικόνα δίσκου με ενεργό τον τόμο."],["Αν είναι κλειδωμένο","Αναζητούμε το **κλειδί ανάκτησης (48 ψηφία)**: Active Directory, Entra ID, λογαριασμός Microsoft του χρήστη, εκτύπωση ή USB. Με το κλειδί, η νεκρή εικόνα του δίσκου αποκρυπτογραφείται εκ των υστέρων με εργαλεία όπως dislocker."],["Τι καταγράφουμε","Την κατάσταση (ξεκλείδωτο/κλειδωμένο), την πηγή του κλειδιού, το hash του κρυπτογραφημένου μέσου και του αποκρυπτογραφημένου τόμου. Χωρίς αυτά, το αντίγραφο δεν μπορεί να συνδεθεί αποδεικτικά με το αρχικό μέσο."]],"Αν το μηχάνημα είναι ακόμη ξεκλείδωτο: **μην το σβήσετε** πριν πάρετε τη μνήμη")],["Ποιος είχε το πειστήριο",$("Έντυπο αλυσίδας επιμέλειας E-003","2.5 Στιγμιότυπο · Chain of Custody","Chain of Custody · E-003",{path:"report/custody/E-003.csv",cols:["Α/Α","Ώρα (UTC)","Παραδίδων","Παραλαμβάνων","Σκοπός","Σφραγίδα","Θέση"],rows:[["1","2026-03-14 08:30","Ι. Νικολάου (IT)","Κ. Καραγιάννης","Κατάσχεση δίσκου","S-88231 ακέραιη","Τσάντα Α4"],["2","2026-03-14 10:05","Κ. Καραγιάννης","Εργαστήριο","Απεικόνιση","S-88231 ακέραιη","Θυρίδα Β2"],["3","2026-03-14 11:48","Εργαστήριο","Κ. Καραγιάννης","Επιστροφή μετά την εικόνα","S-88231 → S-88240","Θυρίδα Β2"],["4","2026-03-20 09:10","Κ. Καραγιάννης","Εισαγγελική αρχή","Παράδοση","S-88240 ακέραιη","Παραλαβή #442"]],hi:[1,2],notes:["Κάθε γραμμή έχει **παραδίδοντα και παραλαμβάνοντα με υπογραφή** και ώρα UTC. Δεν υπάρχει διάστημα χωρίς υπεύθυνο.","Όταν η σφραγίδα αλλάζει (S-88231 → S-88240) καταγράφεται **ο λόγος** και η κατάσταση της παλιάς. Μια αλλαγή χωρίς καταγραφή θεωρείται παραβίαση.","Η τελευταία γραμμή είναι η παράδοση σε τρίτο. Το έντυπο συνοδεύει το πειστήριο και στην ψηφιακή του μορφή (αντίγραφο του hash)."]})]]},$m={notes:{"Η επίθεση ως ακολουθία σταδίων":"Η Kill Chain δημοσιεύθηκε από τη Lockheed Martin το 2011 και δανείζεται στρατιωτική ορολογία. Η χρησιμότητά της για το DFIR είναι διπλή: ως χάρτης ανίχνευσης (τι ίχνη αφήνει κάθε στάδιο) και ως γλώσσα επικοινωνίας προς μη τεχνικά στελέχη («βρήκαμε τον δράστη στο στάδιο 5 από τα 7»).","Τα επτά στάδια":"Κάθε στάδιο αντιστοιχεί σε διαφορετική πηγή πειστηρίων: παράδοση → email gateway και proxy, εκμετάλλευση → EDR και patch, εγκατάσταση → Sysmon/Autoruns, C2 → Zeek και DNS, ενέργειες → DLP και logs εξόδου. Όσο πιο νωρίς σπάσει η αλυσίδα, τόσο μικρότερη η ζημιά.","Τα όρια της Kill Chain":"Η αλυσίδα προϋποθέτει εξωτερικό αντίπαλο που μπαίνει από την περίμετρο. Δεν περιγράφει καλά insiders, επιθέσεις στο cloud ούτε τη φάση μετά την αρχική πρόσβαση (πλευρική κίνηση, κλιμάκωση προνομίων) — εκεί το ATT&CK είναι πολύ πιο αναλυτικό.","Το Μοντέλο Διαμαντιού":"Το Μοντέλο Διαμαντιού (Caltagirone, Pendergast, Betz, 2013) περιγράφει κάθε συμβάν με τέσσερις κορυφές. Το πλεονέκτημά του είναι το **pivoting**: ξεκινάς από ένα γνωστό στοιχείο (μια IP) και ρωτάς ποιο domain, ποιο malware, ποιους άλλους στόχους συνδέει με τον ίδιο αντίπαλο.","Η κοινή γλώσσα της σύγχρονης άμυνας":"Το ATT&CK δεν είναι λίστα ελέγχου αλλά **βάση γνώσης συμπεριφορών**. Η αξία του είναι ότι SOC, κόκκινες ομάδες, προμηθευτές και CTI χρησιμοποιούν τα ίδια αναγνωριστικά (T1059.001), οπότε μια αναφορά μεταφράζεται άμεσα σε ανίχνευση και έλεγχο κάλυψης.","Από τακτική σε διαδικασία":"Παράδειγμα: τακτική TA0003 Επιμονή → τεχνική T1053 Scheduled Task/Job → υπο-τεχνική T1053.005 (Windows) → διαδικασία: ο δράστης X τρέχει `schtasks /create /sc onlogon` με όνομα «UpdateCheck». Η ανίχνευση σχεδιάζεται στο επίπεδο τεχνικής, όχι μόνο της συγκεκριμένης διαδικασίας.","Δείκτες με διαφορετική αξία":"Οι δείκτες υποδομής (hash, IP) είναι φθηνοί για τον αντίπαλο να αλλάξει, οπότε η αξία τους στην ανίχνευση είναι βραχύβια. Οι συμπεριφορές, όμως, απαιτούν αλλαγή του τρόπου λειτουργίας του — και αυτές θέλουμε να ανιχνεύουμε.","Η Πυραμίδα του Πόνου":"David Bianco, 2013: η ιδέα είναι να ρωτάμε «πόσο κοστίζει στον αντίπαλο αν το ανιχνεύσουμε;». Η αναφορά APT1 της Mandiant την ίδια χρονιά έδειξε πώς η ανάλυση εργαλείων και διαδικασιών (ψηλά στην πυραμίδα) προσέφερε πολύ περισσότερα από ξεχωριστές διευθύνσεις IP.","Κόστος αλλαγής για τον αντίπαλο":"Οι τιμές του γραφήματος είναι ενδεικτικές και μεταφέρουν τάξη μεγέθους: το hash αλλάζει σε δευτερόλεπτα με απλή επανασύνταξη, μια IP σε λεπτά με νέο VPS, ενώ η αλλαγή τεχνικών (TTP) απαιτεί εκπαίδευση, νέα εργαλεία και δοκιμές.","Πληροφορίες απειλών ανά αποδέκτη":"Ένα CTI προϊόν πρέπει να απαντά σε συγκεκριμένη απόφαση: η διοίκηση αποφασίζει επενδύσεις, το SOC αποφασίζει ανιχνεύσεις, το IR αποφασίζει προτεραιότητες κυνηγιού. Πληροφορία χωρίς αποδέκτη ή απόφαση είναι θόρυβος.","Τα επίπεδα του CTI":"Κάθε επίπεδο έχει διαφορετικό ρυθμό ανανέωσης: τα IOC λήγουν σε ώρες/ημέρες, οι TTP ζουν χρόνια, η στρατηγική αλλάζει με γεωπολιτικά γεγονότα. Γι' αυτό διαχειριζόμαστε διαφορετικά το κάθε επίπεδο (π.χ. ημερομηνία λήξης μόνο στα IOC).","Ο κύκλος της πληροφορίας":"Ο κύκλος ξεκινά με **απαιτήσεις** (τι θέλουμε να μάθουμε) και όχι με συλλογή. Πολλοί οργανισμοί ξεκινούν από την τροφοδοσία δεδομένων και καταλήγουν σε τεράστιες λίστες IOC που κανείς δεν χρησιμοποιεί.","Χαρτογράφηση κάλυψης με τον ATT&CK Navigator":"Ο Navigator αποθηκεύει τα επίπεδα ως JSON. Μπορείς να εξάγεις επίπεδο κάλυψης από το SIEM, επίπεδο απειλής από αναφορά CTI και να τα «αφαιρέσεις»: οι τεχνικές που χρησιμοποιεί ο αντίπαλος και δεν καλύπτει η ανίχνευσή σου είναι η λίστα προτεραιοτήτων.","Τέσσερα επίπεδα Navigator":"Ο συνδυασμός των τεσσάρων επιπέδων είναι ισχυρός: «Ομάδα απειλής» ∩ «Περιστατικό» δείχνει αν το περιστατικό συμβαδίζει με γνωστό δράστη· «Ομάδα απειλής» ∖ «Κάλυψη» δείχνει τα κενά στην άμυνα.","Ζώντας από τη γη":"Τα LOLBins (Living Off The Land Binaries) τεκμηριώνονται στο project LOLBAS. Η ανίχνευση βασίζεται στο **πλαίσιο**: certutil που κατεβάζει αρχείο από εξωτερική IP, mshta που ξεκινά από Word, rundll32 που φορτώνει DLL από προσωρινό φάκελο.","Κυνήγι απειλών: προδραστική":"Το κυνήγι δεν αντικαθιστά τις ανιχνεύσεις: τις **τροφοδοτεί**. Κάθε επιτυχημένο κυνήγι καταλήγει σε νέα μόνιμη ανίχνευση και κάθε ανεπιτυχές σε τεκμηριωμένη γνώση ότι η υπόθεση δεν ισχύει (με τα δεδομένα που είχαμε).","Οι τρεις φάσεις του TaHiTI":"Το TaHiTI (2018, ολλανδικός χρηματοπιστωτικός τομέας) δίνει μορφή στο κυνήγι: έναυσμα, διερεύνηση, ολοκλήρωση με παραδοτέα — τεκμηρίωση, ανίχνευση, βελτίωση δεδομένων. Χωρίς παραδοτέο το κυνήγι είναι απλώς περιήγηση.","Το πλαίσιο PEAK":"Το PEAK (Splunk SURGe) διακρίνει τρεις τύπους κυνηγιού: με υπόθεση, με βάση αναφοράς (baseline) και με βοήθεια μοντέλων (ML). Καθένας ταιριάζει σε διαφορετική ποιότητα δεδομένων και ωριμότητα ομάδας.","Συμπληρωματικά πλαίσια":"Ο κατάλογος CISA KEV είναι ό,τι πιο πρακτικό για προτεραιοποίηση patching: αν μια ευπάθεια υπάρχει εκεί, **έχει ήδη εκμεταλλευτεί** ο αντίπαλος στην πράξη. Το D3FEND αντιστοιχίζει αμυντικά μέτρα με τεχνικές ATT&CK."},add:[["Από τακτική σε διαδικασία",$("ATT&CK: οι τεχνικές της εκστρατείας SolarWinds","3.5 Στιγμιότυπο · Navigator export (APT29 / SUNBURST)","ATT&CK Navigator · layer «apt29-solarwinds»",{path:"layer.json · domain: enterprise-attack",tabs:["Layer","Τεχνικές (8)","Legend"],cols:["Τακτική","ID","Τεχνική","Βαθμός","Σχόλιο"],rows:[["Initial Access","T1195.002","Compromise Software Supply Chain","100","Trojanized Orion build"],["Command & Control","T1071.001","Application Layer Protocol: Web","90","HTTPS beacons προς avsvmcloud[.]com"],["Command & Control","T1568.002","Dynamic Resolution: DGA","80","Κωδικοποιημένα subdomains"],["Defense Evasion","T1027","Obfuscated Files or Information","70","Καθυστέρηση 12–14 ημερών"],["Credential Access","T1003.006","OS Credential Dumping: DCSync","60","Μετά την πρόσβαση"],["Credential Access","T1606.002","Forge Web Credentials: SAML","100","Golden SAML"],["Persistence","T1098.001","Additional Cloud Credentials","70","Νέα credentials σε εφαρμογές"],["Collection","T1114.002","Remote Email Collection","60","Πρόσβαση σε mailboxes"]],hi:[0,5,1],notes:["Η τεχνική **T1195.002** είναι η αφετηρία: η επίθεση δεν έγινε στον οργανισμό-στόχο αλλά στον προμηθευτή. Οι κλασικές άμυνες περιμέτρου δεν βλέπουν τίποτα.","Το **Golden SAML (T1606.002)** επέτρεψε πρόσβαση σε cloud χωρίς κωδικό ή MFA. Χαρτογραφημένο στον Navigator, φαίνεται ως κενό αν το SOC δεν παρακολουθεί τα logs του ADFS/IdP.","Το επίπεδο «κάλυψη» τοποθετείται πάνω σε αυτό: τεχνικές με υψηλό βαθμό απειλής και χωρίς ανίχνευση είναι το επόμενο έργο μηχανικής ανίχνευσης."]})],["Οι τρεις φάσεις του TaHiTI",$("Ένας δείκτης CTI σε μορφή STIX 2.1","3.4 Στιγμιότυπο · CTI ανταλλαγή","STIX 2.1 · indicator",{path:"cti/reports/2026-03/indicator--8e2e.json",lines:["{",'  "type": "indicator",','  "spec_version": "2.1",','  "id": "indicator--8e2e2d2b-17d4-4cbf-938f-98ee46b3cd3f",','  "created": "2026-03-12T08:00:00.000Z",','  "name": "C2 beacon 198.51.100.44:443",',`  "pattern": "[ipv4-addr:value = '198.51.100.44']",`,'  "pattern_type": "stix",','  "valid_from": "2026-03-12T08:00:00Z",','  "valid_until": "2026-04-12T08:00:00Z",','  "labels": ["malicious-activity"],','  "kill_chain_phases": [{"kill_chain_name": "mitre-attack", "phase_name": "command-and-control"}],','  "confidence": 70',"}"],hi:[6,9,12],notes:["Το **pattern** είναι η μηχανικά αναγνώσιμη ανίχνευση: το ίδιο αντικείμενο μπορεί να μεταφραστεί σε κανόνα Suricata, Zeek Intel ή ερώτημα SIEM.","Το **valid_until** αναγνωρίζει ότι οι δείκτες λήγουν. Χωρίς λήξη, οι λίστες γεμίζουν από παλιά IP που πλέον ανήκουν σε νόμιμους χρήστες.","Το **confidence** και οι φάσεις (kill_chain_phases) δίνουν πλαίσιο: δεν αντιδρούμε ίδια σε δείκτη 30% και σε δείκτη 90%."]})],["Συμπληρωματικά πλαίσια",$("Κατάλογος CISA KEV: ευπάθειες που εκμεταλλεύονται","3.8 Στιγμιότυπο · προτεραιοποίηση patching","CISA · Known Exploited Vulnerabilities Catalog",{path:"cisa.gov/known-exploited-vulnerabilities-catalog",tabs:["Κατάλογος","Φίλτρα","Εξαγωγή CSV/JSON"],cols:["CVE","Προϊόν","Όνομα","Προστέθηκε","Ransomware"],rows:[["CVE-2017-0144","Microsoft SMBv1","EternalBlue","2021-11-03","Known"],["CVE-2019-19781","Citrix ADC/Gateway","Directory Traversal","2021-11-03","Known"],["CVE-2021-26855","Microsoft Exchange","ProxyLogon SSRF","2021-11-03","Known"],["CVE-2021-44228","Apache Log4j2","Log4Shell","2021-12-10","Known"],["CVE-2023-34362","Progress MOVEit Transfer","SQL Injection","2023-06-02","Known"],["CVE-2014-0160","OpenSSL","Heartbleed","2022-05-04","Unknown"]],hi:[3,2],notes:["Όλες οι εγγραφές έχουν **επιβεβαιωμένη ενεργή εκμετάλλευση**. Αυτό είναι πιο ισχυρό κριτήριο από το CVSS: ένας ψηλός βαθμός χωρίς εκμετάλλευση μπορεί να περιμένει, μια εγγραφή KEV όχι.","Η στήλη **Ransomware** δείχνει ότι η ευπάθεια χρησιμοποιείται ήδη από ομάδες ransomware — συνήθως το πρώτο κριτήριο για επείγουσα διόρθωση.","Ο κατάλογος εξάγεται ως JSON και ενσωματώνεται στο SIEM ή στον σαρωτή ευπαθειών, ώστε η προτεραιοποίηση να είναι αυτόματη."]})],["Τα όρια της Kill Chain",Ae("Παράδειγμα pivoting με το Μοντέλο Διαμαντιού","3.1 Εμβάθυνση · από ένα στοιχείο στο δίκτυο του αντιπάλου",[["Σημείο εκκίνησης","Το SOC βλέπει beaconing προς **198.51.100.44** (υποδομή). Δεν γνωρίζει ακόμη τον αντίπαλο ή την ικανότητα. Ο αναλυτής τοποθετεί τη διεύθυνση στην κορυφή «Υποδομή» και σημειώνει τους σταθμούς που επικοινώνησαν (κορυφή «Θύμα»)."],["Pivot στην ικανότητα","Από τη μνήμη του σταθμού προκύπτει το εκτελέσιμο `svhost32.exe` και το hash του. Αναζήτηση του hash σε CTI δείχνει ότι σχετίζεται με γνωστή οικογένεια — η κορυφή «Ικανότητα» συμπληρώνεται και δίνει πρόσθετα IOC (domains, User-Agent)."],["Pivot στον αντίπαλο","Τα ίδια domains εμφανίζονται σε δημοσιευμένη εκστρατεία εναντίον του ίδιου κλάδου. Η κορυφή «Αντίπαλος» αποκτά υποψήφια ομάδα, με χαμηλή βεβαιότητα, και το CTI προτείνει επιπλέον TTP για κυνήγι στο ίδιο περιβάλλον."]],"Το μοντέλο δεν δίνει «ενόχους»: δίνει **υποθέσεις προς έλεγχο** με ρητή βεβαιότητα")],["Η Πυραμίδα του Πόνου",Ae("Από την IP στη συμπεριφορά: ένα πραγματικό παράδειγμα","3.3 Εμβάθυνση · Πυραμίδα του Πόνου στην πράξη",[["Αν ανιχνεύσουμε μόνο hash","Ο αντίπαλος αλλάζει ένα byte και το δείγμα «εξαφανίζεται» από τις λίστες. Η ανίχνευση παραμένει ενεργή αλλά δεν πιάνει τίποτα. Σε λίγες ώρες ξαναρχίζει η ίδια δραστηριότητα με νέο hash."],["Αν ανιχνεύσουμε μόνο IP/domain","Ο αντίπαλος στήνει νέο VPS σε λεπτά. Η ανίχνευση χάνει την αξία της μέσα σε ημέρες. Οι δείκτες υποδομής χρειάζονται ημερομηνία λήξης και συνεχή ανανέωση."],["Αν ανιχνεύσουμε συμπεριφορά","Για παράδειγμα: «διαδικασία που ξεκινά από Office και ανοίγει σύνδεση προς εξωτερική IP με μη τυπικό User-Agent». Ο αντίπαλος πρέπει να αλλάξει τη μέθοδο παράδοσης — κάτι που κοστίζει εβδομάδες και σπάνια το κάνει άμεσα."]],"Η προσπάθεια της ομάδας πρέπει να πηγαίνει στα **ψηλά επίπεδα** της πυραμίδας")]]},e2={notes:{"Στο NTFS, τα πάντα είναι αρχείο":"Ακόμη και τα μεταδεδομένα του συστήματος αρχείων είναι αρχεία ($MFT, $LogFile, $Bitmap). Έτσι ο ερευνητής μπορεί να τα εξάγει από εικόνα και να τα αναλύσει όπως κάθε άλλο αρχείο. Ένα μικρό αρχείο (κάτω από περίπου 700 bytes) αποθηκεύεται ολόκληρο μέσα στην εγγραφή MFT (resident data).","Χρονοσφραγίδες SI έναντι FN":"Οι εφαρμογές και τα εργαλεία (SetFileTime, PowerShell) αλλάζουν εύκολα το SI, αλλά το FN ενημερώνεται μόνο από τον πυρήνα NTFS σε δημιουργία, μετονομασία ή μετακίνηση. Γι' αυτό η ασυμφωνία SI < FN είναι ισχυρή ένδειξη — αλλά όχι απόδειξη: κάποιες νόμιμες λειτουργίες (αντιγραφή από άλλο δίσκο) παράγουν παρόμοιο μοτίβο.","Τα ημερολόγια του NTFS":"Το $UsnJrnl έχει συνήθως μέγεθος μερικών δεκάδων MB και «κυλά»: σε ζωντανό σύστημα καλύπτει από ώρες μέχρι ημέρες. Η εικόνα δίσκου το διατηρεί με την κατάσταση της στιγμής, γι' αυτό η γρήγορη λήψη έχει σημασία. Ένα κενό στο USN ή ξαφνικό μηδενισμό μπορεί να σημαίνει διαγραφή του ημερολογίου.","Εναλλακτικά ρεύματα δεδομένων":"Τα ADS δημιουργήθηκαν για συμβατότητα με το σύστημα αρχείων HFS του Mac. Σήμερα το πιο συνηθισμένο είναι το Zone.Identifier (MOTW) — και αυτό που αξίζει να ελέγχεται είναι η **απουσία** του σε αρχεία που προήλθαν από το διαδίκτυο, γιατί ορισμένα μέσα (π.χ. ISO/VHD) το παρακάμπτουν.","Το Μητρώο: ρυθμίσεις":"Τα κλειδιά έχουν LastWrite αλλά **όχι** τα values· έτσι η ώρα δείχνει την τελευταία αλλαγή οποιουδήποτε value κάτω από το κλειδί. Τα αρχεία .LOG1/.LOG2 κρατούν αλλαγές που δεν έχουν ακόμη συγχωνευθεί — τα εργαλεία (Registry Explorer) τα εφαρμόζουν πριν την ανάλυση.","Επιμονή: η απάντηση στην επανεκκίνηση":"Κανένας αντίπαλος με μακροπρόθεσμο στόχο δεν βασίζεται σε έναν μηχανισμό. Η ανάλυση επιμονής γίνεται με εργαλεία όπως Autoruns (ζωντανά) και RegRipper/RECmd (σε εικόνα) και ελέγχει **όλες** τις γνωστές θέσεις, όχι μόνο τα κλειδιά Run.","Ο χάρτης επιμονής των Windows":"Οι μηχανισμοί διαφέρουν σε «θόρυβο»: τα Run keys είναι εύκολα ορατά, οι WMI subscriptions και η κατάχρηση DLL search order πολύ λιγότερο. Η ανίχνευση θέλει και τα δύο άκρα: ελέγχους στα κλασικά σημεία και κυνήγι στα σπάνια.","Τι έκανε ο χρήστης; Shellbags":"Τα Shellbags αποδεικνύουν ότι ένας συγκεκριμένος χρήστης **άνοιξε** έναν φάκελο (π.χ. E:\\Confidential ή \\\\srv\\hr). Ισχύουν και όταν ο εξωτερικός δίσκος ή ο φάκελος δεν υπάρχουν πια, γι' αυτό είναι πολύτιμα σε υποθέσεις διαρροής δεδομένων.","Τεκμήρια δραστηριότητας χρήστη":"Κάθε τεκμήριο απαντά διαφορετικό ερώτημα και φέρει άλλο βαθμό βεβαιότητας. Τα LNK και οι Jump Lists δείχνουν αρχεία που **ανοίχτηκαν**, τα Shellbags φακέλους που **προβλήθηκαν**, τα RecentDocs πρόσφατη χρήση. Διασταυρώνονται με το USN.","Μηχανές χρόνου: VSS":"Τα VSS περιέχουν εκδόσεις αρχείων και κυψελών πριν από την παρέμβαση. Το ransomware τα διαγράφει (T1490), γι' αυτό η εντολή `vssadmin delete shadows` είναι σχεδόν βεβαιότητα ransomware. Αν παραμένουν, μπορούν να προσαρτηθούν μόνο για ανάγνωση (`vshadowmount`).","Όταν ο αντίπαλος τυφλώνει":"Η αντι-εγκληματολογία σπάνια είναι τέλεια: ο δράστης διαγράφει logs, αλλά το γεγονός της διαγραφής καταγράφεται (1102/104), η εκτέλεση της εντολής μένει σε Prefetch/USN και τα απομακρυσμένα logs δεν αλλάζουν. Το κενό είναι πληροφορία.","Ξεσκέπασμα timestomping":"Η μέθοδος βασίζεται σε **τρεις ανεξάρτητους ελέγχους**: SI vs FN, κλάσματα δευτερολέπτου (τα εργαλεία συχνά γράφουν .0000000) και ασυμφωνία με το USN Journal. Ένας μόνο έλεγχος δεν αρκεί για βεβαιότητα.","Ανασύνθεση ενός αρχείου από το USN":"Το USN καταγράφει **λόγους αλλαγής** (reason flags), όχι περιεχόμενο. Η αφήγηση προκύπτει από το ποια αλλαγή προηγήθηκε ποιας. Εδώ: δημιουργία → εγγραφή → μετονομασία (για απόκρυψη) → διαγραφή, μέσα σε λίγες ώρες."},add:[["Χρονοσφραγίδες SI έναντι FN",$("Timeline Explorer: αναζήτηση timestomping","4.9 Στιγμιότυπο · MFTECmd → Timeline Explorer","Timeline Explorer · mft.csv",{path:"forensics\\mft.csv · φίλτρο: SI Created < FN Created",tabs:["mft.csv","usn.csv","Bookmarks (2)"],cols:["Entry","FileName","Created0x10 (SI)","Created0x30 (FN)","Δ","ParentPath"],rows:[["0x18A2C","svhost32.exe","2019-06-11 09:00:00.0000000","2026-03-13 22:38:02.4127731","+2467 ημ.",".\\Users\\ntsakos\\AppData\\Local\\Temp"],["0x18A31","u.exe","2021-02-03 12:00:00.0000000","2026-03-13 22:41:01.9902113","+1864 ημ.",".\\ProgramData"],["0x0D4F2","report.docx","2026-03-12 15:22:41.3311204","2026-03-12 15:22:41.3311204","0",".\\Users\\ntsakos\\Documents"],["0x0D511","Q1-budget.xlsx","2026-03-10 09:15:07.1120089","2026-03-10 09:15:07.1120089","0",".\\Users\\ntsakos\\Documents"]],hi:[0,1],detail:[["Ύποπτα αρχεία","2"],["Κοινό μοτίβο","SI = ακριβώς hh:mm:00.0000000"],["Διαδρομή","Temp και ProgramData"],["Επόμενο βήμα","Διασταύρωση με $UsnJrnl"]],notes:["Το **SI** έχει «στρογγυλοποιημένη» ώρα με επτά μηδενικά ψηφία, ενώ το **FN** κρατά την πραγματική ώρα του πυρήνα. Το μοτίβο είναι κλασικό σημάδι εργαλείου timestomping.","Τα δύο αρχεία βρίσκονται σε τοποθεσίες που προτιμούν αντίπαλοι (**Temp**, **ProgramData**) και συμπίπτουν με την ώρα των συμβάντων 4688 και Sysmon.","Τα φυσιολογικά αρχεία (docx, xlsx) έχουν SI = FN μέχρι το κλάσμα. Η σύγκριση με «καθαρά» αρχεία στηρίζει την αξιολόγηση."]})],["Στο NTFS, τα πάντα είναι αρχείο",$("Η κεφαλίδα μιας εγγραφής MFT σε hex","4.1 Στιγμιότυπο · hex editor","HxD / MFT Explorer · $MFT @ 0x18A2C × 1024",{path:"E:\\$MFT · offset 0x62B0000",lines:["Offset   00 01 02 03 04 05 06 07  08 09 0A 0B 0C 0D 0E 0F  ASCII","0000     46 49 4C 45 30 00 03 00  A1 7C 2B 01 00 00 00 00  FILE0....|+.....","0010     03 00 01 00 38 00 01 00  A8 01 00 00 00 04 00 00  ....8...........","0020     00 00 00 00 00 00 00 00  05 00 00 00 2C 8A 01 00  ............,...","0030     6F 00 00 00 00 00 00 00  10 00 00 00 60 00 00 00  o...........`...","# 0x00  Υπογραφή «FILE»          # 0x14  Offset 1ου attribute = 0x38","# 0x16  Flags 0x01 = σε χρήση    # 0x1C  Δεσμευμένο μέγεθος = 0x400 (1024)","# 0x38  Attribute 0x10 = $STANDARD_INFORMATION, μήκος 0x60"],hi:[1,2,4],notes:["Η υπογραφή **FILE** (46 49 4C 45) ξεκινά κάθε έγκυρη εγγραφή. Αν βρεθεί «BAAD», η εγγραφή είναι φθαρμένη· αν λείπει, μπορεί να είναι κενός χώρος.","Στο offset **0x16** τα flags δείχνουν 0x01 (σε χρήση). Το 0x00 σημαίνει **διαγραμμένο αρχείο** — τα δεδομένα συχνά παραμένουν αναλύσιμα.","Το πρώτο attribute (**0x10**) είναι το $STANDARD_INFORMATION που περιέχει τις τέσσερις χρονοσφραγίδες MACB προς σύγκριση με το $FILE_NAME (0x30)."]})],["Επιμονή: η απάντηση στην επανεκκίνηση",$("Registry Explorer: κλειδί Run με LastWrite","4.5 Στιγμιότυπο · NTUSER.DAT","Registry Explorer · NTUSER.DAT (ntsakos)",{path:"Software\\Microsoft\\Windows\\CurrentVersion\\Run",tabs:["Values (3)","Key info","Deleted keys"],cols:["Value name","Type","Data","LastWrite (key)"],rows:[["OneDrive","REG_SZ",'"C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe" /background',"2026-02-11 08:10:02"],["SecurityHealth","REG_EXPAND_SZ","%windir%\\system32\\SecurityHealthSystray.exe","2026-02-11 08:10:02"],["Updater","REG_SZ","C:\\ProgramData\\u.exe -s","2026-03-13 22:41:07"]],hi:[2],detail:[["Πρόσφατη αλλαγή","13 Μαρτ 22:41:07"],["Ταιριάζει με","4698 + Prefetch u.exe"],["Εκτελέσιμο εκτός","Program Files / System32"],["Όνομα","Παραπλανητικό («Updater»)"]],notes:["Το **LastWrite 22:41:07** διαφέρει από τα υπόλοιπα values (Φεβρουάριος). Η αλλαγή συμπίπτει με τη χρονογραμμή του περιστατικού και δένει με άλλες πηγές.","Το εκτελέσιμο βρίσκεται στο **C:\\ProgramData**: εγγράψιμο από κάθε χρήστη και συχνά αγνοείται από ελέγχους. Οι νόμιμες εφαρμογές εγκαθίστανται σε Program Files.","Η επιμονή αυτή ενεργοποιείται **μόνο** όταν συνδεθεί ο συγκεκριμένος χρήστης. Θα πρέπει να ελεγχθεί και το αντίστοιχο κλειδί στο HKLM."]})],["Εναλλακτικά ρεύματα δεδομένων",Ae("Mark of the Web: τι το δημιουργεί και πώς παρακάμπτεται","4.3 Εμβάθυνση · MOTW στην πράξη",[["Τι είναι","Όταν ένας browser ή client email αποθηκεύει αρχείο από το διαδίκτυο, γράφει το ADS `Zone.Identifier` με `ZoneId=3` και συχνά `HostUrl`/`ReferrerUrl`. Το Windows χρησιμοποιεί το MOTW για προειδοποιήσεις (SmartScreen, Protected View) και για αποκλεισμό μακροεντολών από τη Microsoft από το 2022."],["Πώς παρακάμπτεται","Αρχεία μέσα σε **ISO/VHD** ή ορισμένα αρχεία ZIP παλαιότερων εργαλείων δεν κληρονομούσαν πάντα το MOTW στα περιεχόμενα. Έτσι μια LNK ή DLL μέσα σε ISO εκτελούνταν χωρίς προειδοποίηση. Η Microsoft κάλυψε μέρος του προβλήματος σε πρόσφατες ενημερώσεις."],["Τι δείχνει στον ερευνητή","Το `HostUrl` αποδεικνύει **από πού** κατέβηκε το αρχείο· η απουσία του, σε αρχείο που προφανώς προήλθε από email/λήψη, είναι από μόνη της ένδειξη. Η ώρα δημιουργίας του ADS δίνει πότε έγινε η λήψη."]],"Πρακτικός έλεγχος: `dir /r` και `Get-Item -Stream *` για κάθε ύποπτο αρχείο")],["Όταν ο αντίπαλος τυφλώνει",Ae("Πώς αποκαλύπτεται η εκκαθάριση ημερολογίου","4.8 Εμβάθυνση · το κενό ως τεκμήριο",[["Το ίδιο το γεγονός","Όταν καθαρίζει το Security log, γράφεται αμέσως το συμβάν **1102** με τον χρήστη και τη σύνοδο που το έκανε. Για το System log αντίστοιχο είναι το **104**. Ο αντίπαλος μπορεί να καθαρίσει τα παλιά, όχι το νέο συμβάν που δημιουργεί ο ίδιος ο καθαρισμός."],["Έμμεσα ίχνη","Η εντολή `wevtutil cl Security` αφήνει Prefetch (WEVTUTIL.EXE), Amcache, ίχνος στο PowerShell ή Sysmon 1 και μετρικές διαφορές στο μέγεθος του αρχείου .evtx. Ακόμη και χωρίς 1102, ένα Security log που ξεκινά από ώρα 03:12 χωρίς προηγούμενα είναι ύποπτο."],["Πηγές που ο δράστης δεν φτάνει","Τα logs που στέλνονται σε κεντρικό SIEM/συλλέκτη, οι καταγραφές του ελεγκτή τομέα, τα logs δικτύου (Zeek/Suricata) και τα snapshots (VSS) αποτελούν εναλλακτικές πηγές. Γι' αυτό η αποστολή logs σε πραγματικό χρόνο είναι θεμελιώδες μέτρο ετοιμότητας."]],"Κανόνας: **ό,τι λείπει από μία πηγή αναζητείται σε δεύτερη**")]]},t2={notes:{"Δεν αποδεικνύουν όλα το ίδιο":"Το ShimCache λέει ότι το σύστημα «είδε» το αρχείο, το Prefetch ότι εκτελέστηκε, το BAM ότι εκτελέστηκε από συγκεκριμένο χρήστη. Ο ερευνητής γράφει στην αναφορά **τη διατύπωση που αντιστοιχεί στο τεκμήριο**: «υπήρχε», «πιθανώς εκτελέστηκε», «εκτελέστηκε» — όχι πάντα το ισχυρότερο.","Η σκάλα βεβαιότητας":"Η σκάλα βοηθά στην ακριβή διατύπωση: με BAM + Prefetch + 4688 μπορούμε να πούμε «ο χρήστης Χ εκτέλεσε το αρχείο στις hh:mm». Με μόνο ShimCache λέμε «το αρχείο υπήρχε στο σύστημα και ενδέχεται να εκτελέστηκε». Η διαφορά έχει αποδεικτική σημασία.","Prefetch: ο πρωταθλητής":"Το Prefetch δημιουργήθηκε για επιτάχυνση εκκίνησης εφαρμογών. Το ίχνος του για εγκληματολογία είναι ιδανικό: κρατά ονόματα αρχείων που φορτώθηκαν τα πρώτα 10 δευτερόλεπτα, ποιοι τόμοι χρησιμοποιήθηκαν και έως 8 ώρες εκτέλεσης (Windows 10/11). Η μορφή είναι συμπιεσμένη (MAM) και αναλύεται με PECmd.","Παγίδες του Prefetch":"Το Prefetch είναι συνήθως απενεργοποιημένο σε διακομιστές και μπορεί να είναι απενεργοποιημένο σε SSD σε ορισμένες ρυθμίσεις. Αντί για συμπέρασμα «δεν εκτελέστηκε», η σωστή διατύπωση είναι «δεν βρέθηκε ίχνος Prefetch — ελέγχθηκε η πολιτική EnablePrefetcher».","ShimCache και Amcache":"Το ShimCache γράφεται στο μητρώο **κατά τον τερματισμό**, οπότε ένα σύστημα που δεν έχει επανεκκινήσει μπορεί να έχει πρόσφατες εγγραφές μόνο στη μνήμη. Το Amcache κρατά SHA-1 του πρώτου 31 MB του αρχείου — χρήσιμο για αναζήτηση σε βάσεις γνωστών δειγμάτων.","ShimCache έναντι Amcache":"Τα δύο συμπληρώνονται: το ShimCache δίνει πλήθος αρχείων και σειρά, το Amcache ταυτότητα (hash, εκδότης, έκδοση). Σε περιπτώσεις που ο δράστης διέγραψε το εκτελέσιμο, το Amcache μπορεί να είναι το μόνο που κρατά το hash για αναζήτηση.","Ποιος το εκτέλεσε; UserAssist":"Το UserAssist είναι αποθηκευμένο στο NTUSER.DAT του χρήστη, οπότε η απόδοση σε χρήστη προκύπτει από τη θέση του. Οι ονομασίες κωδικοποιούνται με ROT13 — τα εργαλεία (RegRipper, Registry Explorer) το αποκωδικοποιούν αυτόματα.","Πηγές απόδοσης σε χρήστη":"Το SRUM (System Resource Usage Monitor) κρατά περίπου 30–60 ημέρες δραστηριότητας δικτύου και CPU ανά εφαρμογή και SID — εξαιρετικό για να αποδείξεις πόσα δεδομένα έστειλε μια διεργασία, ακόμη και όταν δεν υπάρχουν άλλα logs.","Διασταύρωση στον πίνακα: svhost32.exe":"Καμία πηγή δεν λέει όλη την ιστορία: το USN δίνει τη δημιουργία, το Amcache την ταυτότητα, το Prefetch τις εκτελέσεις, το BAM τον χρήστη, το 4688 τον γονέα και τη γραμμή εντολών. Η συμφωνία τους είναι αυτή που κάνει τη βιογραφία ισχυρή.","Το οικοσύστημα των .evtx":"Τα .evtx αρχεία βρίσκονται στο C:\\Windows\\System32\\winevt\\Logs. Εκτός από Security/System/Application, τα κανάλια Microsoft-Windows-* (PowerShell, TaskScheduler, TerminalServices, Sysmon) συχνά έχουν το πιο χρήσιμο περιεχόμενο. Το πλήθος και το μέγεθος ρυθμίζονται από πολιτική.","EID 4624: οι τύποι σύνδεσης":"Σημαντικό: ο τύπος 3 (δικτυακός) είναι ο συχνότερος και δεν σημαίνει πάντα απειλή· ο τύπος 10 από εξωτερική IP ή ο τύπος 9 (NewCredentials) από ασυνήθιστη διεργασία αξίζουν άμεση διερεύνηση. Συνεκτιμάται με το πεδίο AuthenticationPackageName (NTLM/Kerberos).","Δέσιμο μιας συνόδου":"Το TargetLogonId του 4624 εμφανίζεται ως SubjectLogonId στα 4688, 4672, 4634 της ίδιας συνόδου. Με μία αναζήτηση στο LogonId ανασυνθέτεις **ό,τι έκανε ο χρήστης από τη στιγμή της σύνδεσης**, από τις διεργασίες μέχρι την αποσύνδεση.","Καταγραφή διεργασιών και PowerShell":"Το 4688 με γραμμή εντολών ενεργοποιείται από πολιτική (Audit Process Creation + Include command line). Το 4104 (script block) καταγράφει τον **αποκωδικοποιημένο** κώδικα, ακόμη και αν ο αντίπαλος χρησιμοποίησε base64 ή obfuscation — γι' αυτό είναι από τα πιο πολύτιμα logs.","Ο κανόνας της απουσίας":"Δύο ερωτήσεις πάντα: (1) Ήταν ενεργοποιημένη η πηγή; (2) Έχει κυλήσει ή διαγραφεί; Μόνο όταν η πηγή ήταν ενεργή και άθικτη, η απουσία εγγραφής έχει ισχύ. Η απάντηση καταγράφεται στην αναφορά ως περιορισμός της έρευνας.","Γιατί μπορεί να λείπει":"Ελέγξτε πάντα την πολιτική (auditpol /get /category:*) και το μέγεθος/ημερομηνία του παλαιότερου συμβάντος. Ένα Security log που καλύπτει μόλις 6 ώρες σε πολυσύχναστο σύστημα εξηγεί γιατί δεν υπάρχουν ίχνη παλαιότερης δραστηριότητας."},add:[["EID 4624: οι τύποι σύνδεσης",$("Event Viewer: το συμβάν 4624 σε RDP","5.6 Στιγμιότυπο · Security log","Event Viewer · Windows Logs › Security",{path:"Event ID 4624 · An account was successfully logged on",tabs:["General","Details","Friendly View"],cols:["Πεδίο","Τιμή","Τι σημαίνει"],rows:[["TimeCreated","2026-03-13T22:31:10.483Z","Ώρα UTC της σύνδεσης"],["SubjectUserName","FIN-WS-114$","Ο λογαριασμός μηχανής που ζήτησε τη σύνδεση"],["TargetUserName","ntsakos","Ο χρήστης που συνδέθηκε"],["LogonType","10","RemoteInteractive (RDP)"],["IpAddress","198.51.100.44","Εξωτερική διεύθυνση πηγής"],["AuthenticationPackageName","Negotiate","Kerberos ή NTLM ανά περίπτωση"],["TargetLogonId","0x2a7f31","Κλειδί συσχέτισης συνόδου"],["ElevatedToken","%%1842 (Yes)","Η σύνοδος έχει διαχειριστικά δικαιώματα"]],hi:[3,4,6],notes:["**LogonType 10** σημαίνει RDP. Από μόνο του δεν είναι ύποπτο· γίνεται όταν συνδυαστεί με την πηγή, την ώρα και τον χρήστη.","Η **IpAddress** είναι εξωτερική (εύρος τεκμηρίωσης εδώ). Ένας εσωτερικός χρήστης που συνδέεται με RDP από το διαδίκτυο δείχνει έκθεση της υπηρεσίας ή κλεμμένα διαπιστευτήρια.","Το **TargetLogonId 0x2a7f31** ενώνει όλα τα υπόλοιπα συμβάντα της ίδιας συνόδου (4672, 4688, 4634). Είναι το πρώτο πεδίο που κρατάμε στις σημειώσεις."]})],["Παγίδες του Prefetch",$("PECmd: αναλυμένο Prefetch αρχείο","5.2 Στιγμιότυπο · SVHOST32.EXE-4A1B2C3D.pf","PECmd 1.5 · Prefetch analysis",{path:"C:\\Windows\\Prefetch\\SVHOST32.EXE-4A1B2C3D.pf",lines:["Executable name: SVHOST32.EXE","Hash: 4A1B2C3D   Version: Windows 10 or Windows 11","Run count: 3","Last run: 2026-03-13 22:39:14","Other run times: 2026-03-13 22:38:59, 2026-03-13 22:38:31","Volume 0 name: \\VOLUME{01d9a4…}  Created: 2026-03-11 07:59:02  Serial: 5C2A-9F11","Directories referenced: 12   Files referenced: 47","00: \\WINDOWS\\SYSTEM32\\NTDLL.DLL","01: \\USERS\\NTSAKOS\\APPDATA\\LOCAL\\TEMP\\SVHOST32.EXE","02: \\WINDOWS\\SYSTEM32\\WS2_32.DLL","03: \\WINDOWS\\SYSTEM32\\WININET.DLL","04: \\USERS\\NTSAKOS\\APPDATA\\LOCAL\\TEMP\\CONF.DAT"],hi:[2,8,10],notes:["**Run count 3** με τρεις ώρες (22:38:31, 22:38:59, 22:39:14): το εκτελέσιμο ξεκίνησε τρεις φορές μέσα σε 43 δευτερόλεπτα, πιθανώς λόγω επανεκκίνησης από τον γονέα του.","Η διαδρομή αποκαλύπτει προέλευση από **AppData\\Local\\Temp** — όχι System32, παρά το όνομα που μιμείται το svchost.exe.","Οι βιβλιοθήκες **WS2_32.DLL/WININET.DLL** δείχνουν δικτυακή λειτουργικότητα, ενώ το CONF.DAT στον ίδιο φάκελο είναι πιθανό αρχείο ρυθμίσεων του κακόβουλου."]})],["Ποιος το εκτέλεσε; UserAssist",$("Registry Explorer: BAM και UserAssist","5.4 Στιγμιότυπο · απόδοση σε χρήστη","RegRipper / Registry Explorer · SYSTEM & NTUSER.DAT",{path:"SYSTEM\\CurrentControlSet\\Services\\bam\\State\\UserSettings",cols:["Πηγή","SID / Χρήστης","Εκτελέσιμο","Τελευταία εκτέλεση (UTC)"],rows:[["BAM","S-1-5-21-…-1104 (ntsakos)","\\Device\\HarddiskVolume3\\Users\\ntsakos\\AppData\\Local\\Temp\\svhost32.exe","2026-03-13 22:39:14"],["BAM","S-1-5-21-…-1104 (ntsakos)","\\Device\\HarddiskVolume3\\Windows\\System32\\cmd.exe","2026-03-13 22:38:40"],["BAM","S-1-5-21-…-500 (Administrator)","\\Device\\HarddiskVolume3\\Windows\\System32\\mmc.exe","2026-03-12 09:11:03"],["UserAssist","ntsakos","Microsoft.Office.WINWORD.EXE.15","2026-03-13 22:35:12 · runs: 4"],["UserAssist","ntsakos","{1AC14E77…}\\wscript.exe","2026-03-13 22:38:20 · runs: 1"]],hi:[0,4],notes:["Το **BAM** αποδίδει την τελευταία εκτέλεση του svhost32.exe στον **ntsakos** στις 22:39:14 — ακριβώς η ώρα του Prefetch. Δύο ανεξάρτητες πηγές συμφωνούν.","Το **UserAssist** δείχνει ότι λίγο νωρίτερα ο ίδιος χρήστης εκκίνησε το wscript.exe και το Word: πιθανή αλυσίδα Word → wscript → svhost32.","Οι εγγραφές του Administrator (χθες, mmc.exe) είναι φυσιολογική διαχείριση και δεν πρέπει να αναμιχθούν με την υπόθεση."]})],["Καταγραφή διεργασιών και PowerShell",Ae("Τα τρία επίπεδα καταγραφής PowerShell","5.7 Εμβάθυνση · τι καταγράφει το καθένα",[["Module logging (4103)","Καταγράφει τις εντολές και τις παραμέτρους που περνούν από pipeline, μαζί με τα αποτελέσματα. Είναι χρήσιμο για να δεις **τι δεδομένα** πέρασαν από ένα cmdlet (π.χ. Invoke-WebRequest) αλλά μπορεί να παράγει μεγάλο όγκο. Ενεργοποιείται ανά module ή με χαρακτήρα μπαλαντέρ."],["Script block logging (4104)","Καταγράφει το **πλήρες κείμενο κάθε script block** όταν εκτελείται, αποκωδικοποιώντας το base64 και το obfuscation που έχει ήδη επιλυθεί στη μνήμη. Το πεδίο ScriptBlockId επιτρέπει να ενώσεις τμήματα μεγάλων scripts. Είναι το πιο πολύτιμο για ανάλυση κακόβουλων cradle."],["Transcription","Γράφει τη συνολική έξοδο κάθε συνόδου σε αρχείο κειμένου. Παρέχει πλήρες ιστορικό διαδραστικών συνόδων, αλλά χρειάζεται ασφαλή, κεντρική αποθήκευση: αν ο αντίπαλος μπορεί να διαγράψει τον φάκελο, το πειστήριο χάνεται."]],"Ελάχιστο σύνολο: **4104 + 4688 με γραμμή εντολών + Sysmon 1**, με αποστολή σε κεντρικό σύστημα")],["Ο κανόνας της απουσίας",Ae("Τύποι σύνδεσης 3, 9 και 10: πώς τους ξεχωρίζουμε","5.6 Εμβάθυνση · ερμηνεία στην πράξη",[["Τύπος 3 · Network","Η πιο συχνή σύνδεση: πρόσβαση σε SMB/κοινόχρηστα, RPC, WMI. Ο ερευνητής κοιτά **από ποιον σταθμό** (WorkstationName/IpAddress), σε **ποια ώρα** και αν ο χρήστης πρόσβαινε εκεί για πρώτη φορά. Πολλές διαφορετικές στοχευμένες συνδέσεις τύπου 3 από έναν σταθμό είναι μοτίβο πλευρικής κίνησης."],["Τύπος 9 · NewCredentials","Προκύπτει με `runas /netonly` ή εργαλεία που «μεταφέρουν» διαπιστευτήρια για δικτυακή χρήση. Η τοπική σύνοδος δεν αλλάζει, όμως οι εξωτερικές συνδέσεις γίνονται με άλλο λογαριασμό — συχνό σημάδι pass-the-hash/overpass-the-hash όταν εμφανίζεται από ασυνήθιστη διεργασία."],["Τύπος 10 · RDP","Δείχνει διαδραστική απομακρυσμένη σύνοδο. Προσοχή σε εξωτερικές IP, σε ώρες εκτός ωραρίου και σε συνδέσεις από VPN/jump host. Στο ίδιο LogonId ακολουθούν συνήθως 4672 (προνόμια) και 4688 (διεργασίες) — ο δράστης «φαίνεται» όπως ένας διαχειριστής."]],"Πάντα: **τύπος + IP + χρήστης + ώρα + LogonId** — ποτέ ο τύπος μόνος")]]},l2={notes:{"Τι είναι το Sysmon και γιατί":"Το Sysmon (System Monitor) των Mark Russinovich και Thomas Garnier ανήκει στα Sysinternals της Microsoft. Εγκαθίσταται ως υπηρεσία και οδηγός πυρήνα και γράφει σε δικό του κανάλι EVTX. Δεν αντικαθιστά το EDR — είναι φθηνή, ελεγχόμενη τηλεμετρία που ο ερευνητής μπορεί να ρυθμίσει και να διατηρήσει.","Εγγενές logging έναντι Sysmon":"Το 4688 δεν δίνει hash, ούτε σταθερό αναγνωριστικό διεργασίας. Το Sysmon EID 1 προσθέτει **Hashes**, **ProcessGuid**, **ParentProcessGuid**, **IntegrityLevel** και **ParentCommandLine**, που κάνουν τη συσχέτιση χιλιάδων συμβάντων αξιόπιστη.","Εγκατάσταση και επαλήθευση":"Στο περιστατικό, η ύπαρξη Sysmon μπορεί να **ελεγχθεί** από τον αντίπαλο (με `sc query` ή αναζήτηση οδηγού). Γι' αυτό ορισμένοι οργανισμοί χρησιμοποιούν μη τυπικό όνομα υπηρεσίας/οδηγού — που όμως πρέπει να είναι γνωστό στον SOC για να ελέγχεται σε όλο το στόλο.","Ροή διανομής Sysmon":"Η διαμόρφωση XML διαχειρίζεται ως κώδικας: αποθετήριο, δοκιμή σε ομάδα πιλότο (μέτρηση όγκου συμβάντων ανά ημέρα), σταδιακή διανομή και συνεχή επαλήθευση. Μια ασυντόνιστη διαμόρφωση μπορεί να παράγει εκατομμύρια περιττά συμβάντα ή να αφήσει τυφλά σημεία.","Τα συμβάντα που κρίνουν":"Η τετράδα 10, 7, 3, 1 ταιριάζει στην αλυσίδα επίθεσης: εκτέλεση (1), επικοινωνία (3), φόρτωση κακόβουλων βιβλιοθηκών (7), κλοπή διαπιστευτηρίων (10). Ο ερευνητής ξεκινά από αυτά και επεκτείνεται σε 11, 13, 22 ανάλογα με την υπόθεση.","Το ProcessGuid ως κόμβος":"Το PID επαναχρησιμοποιείται από τα Windows, οπότε δύο διαφορετικές διεργασίες μπορεί να έχουν το ίδιο PID σε ώρες διαφορά. Το **ProcessGuid** είναι μοναδικό και επιτρέπει να ενώσεις σε ένα «δέντρο» όλα τα συμβάντα μιας διεργασίας, ακόμη και σε πολλά μηχανήματα (με το όνομα υπολογιστή).","Η φιλοσοφία της διαμόρφωσης":"Ξεκινήστε από γνωστή βάση (SwiftOnSecurity ή sysmon-modular), μετρήστε τον όγκο ανά EID για 1–2 εβδομάδες και προσαρμόστε. Οι εξαιρέσεις πρέπει να γράφονται με **στενά κριτήρια** (πλήρης διαδρομή + υπογραφή), γιατί μια πλατιά εξαίρεση γίνεται κρυφτό για τον αντίπαλο.","Include έναντι Exclude":"Στο include ορίζεις τι θέλεις να δεις· ό,τι δεν προβλέπεις, χάνεται. Στο exclude βλέπεις τα πάντα και φιλτράρεις γνωστό θόρυβο. Οι κρίσιμες πηγές (Process Create, LSASS access) συνήθως ρυθμίζονται με exclude, ενώ οι θορυβώδεις (DNS, Image Load) με include.","Δημοφιλείς βάσεις εκκίνησης":"Οι δύο βάσεις είναι ανοικτού κώδικα και περιέχουν σχόλια ανά κανόνα με αναφορά σε ATT&CK. Η προσθήκη δικού σας περιβάλλοντος (π.χ. εργαλεία διαχείρισης που χρησιμοποιεί το IT) απαιτεί δοκιμή και συντήρηση με κάθε νέα έκδοση.","Προχωρημένα συμβάντα":"Τα EID 8 και 10 ανιχνεύουν injection και πρόσβαση σε LSASS, το EID 25 (ProcessTampering) πιάνει hollowing/herpaderping, το EID 22 δίνει τη σύνδεση διεργασίας-DNS ερωτήματος. Κάθε ένα προϋποθέτει τη σωστή διαμόρφωση — δεν είναι ενεργά «από μόνα τους».","Πώς προστατεύουμε την τηλεμετρία":"Η προστασία του αισθητήρα είναι δική του πειθαρχία: ο πράκτορας στέλνει τα συμβάντα άμεσα, το SIEM ειδοποιεί όταν ένας σταθμός «σιωπήσει» και οι αλλαγές στη διαμόρφωση (EID 16) είναι ειδοποίηση υψηλής προτεραιότητας. Ο χρήστης δεν πρέπει να έχει δικαίωμα διακοπής της υπηρεσίας.","Αλυσίδα Sysmon σε πλευρική κίνηση":"Η αλυσίδα φαίνεται σε δύο μηχανήματα: στον προορισμό EID 3 (εισερχόμενη σύνδεση), EID 11 (νέο αρχείο), EID 1 (εκτέλεση υπηρεσίας) και EID 13 (επιμονή). Με το ProcessGuid και το όνομα υπολογιστή, ο αναλυτής ενώνει την πηγή και τον προορισμό."},add:[["Το ProcessGuid ως κόμβος",$("Event Viewer: Sysmon EID 1 με πλήρες πλαίσιο","6.5 Στιγμιότυπο · Microsoft-Windows-Sysmon/Operational","Event Viewer · Sysmon/Operational · Event 1",{path:"Process Create (rule: ProcessCreate)",tabs:["General","Details","XML View"],cols:["Πεδίο","Τιμή"],rows:[["UtcTime","2026-03-13 22:38:59.204"],["ProcessGuid","{5B2C4E0A-8F93-6602-D001-000000000F00}"],["Image","C:\\Users\\ntsakos\\AppData\\Local\\Temp\\svhost32.exe"],["CommandLine","svhost32.exe -s 198.51.100.44:443"],["ParentImage","C:\\Windows\\System32\\wscript.exe"],["ParentCommandLine",'wscript.exe "C:\\Users\\ntsakos\\Downloads\\invoice.vbs"'],["Hashes","SHA256=9BE1…D0, IMPHASH=E4B2…"],["IntegrityLevel","Medium"],["User","FIN\\ntsakos"]],hi:[5,3,6],notes:["Ο γονέας **wscript.exe** εκτελεί αρχείο `invoice.vbs` από το Downloads: ξεκάθαρη ένδειξη phishing με συνημμένο script.","Η **γραμμή εντολών** περιέχει IP και θύρα: ο C2 «ζει» ήδη στην παράμετρο εκκίνησης και δεν χρειάζεται δικτυακή ανάλυση για να ανακαλυφθεί.","Το **SHA256** επιτρέπει άμεση αναζήτηση σε CTI, και το **IMPHASH** ομαδοποιεί παραλλαγές του ίδιου εκτελέσιμου."]})],["Το ProcessGuid ως κόμβος",$("Απόσπασμα διαμόρφωσης Sysmon (XML)","6.6 Στιγμιότυπο · sysmonconfig.xml","sysmonconfig.xml · VS Code",{path:"sysmon/sysmonconfig.xml · schemaversion 4.90",lines:['<Sysmon schemaversion="4.90">',"  <HashAlgorithms>sha256,imphash</HashAlgorithms>","  <EventFiltering>",'    <RuleGroup name="" groupRelation="or">','      <ProcessCreate onmatch="exclude">','        <Image condition="is">C:\\Windows\\System32\\conhost.exe</Image>',"      </ProcessCreate>",'      <ProcessAccess onmatch="include">','        <TargetImage condition="is">C:\\Windows\\System32\\lsass.exe</TargetImage>',"      </ProcessAccess>",'      <ImageLoad onmatch="include">','        <ImageLoaded condition="contains any">\\AppData\\;\\Temp\\;\\ProgramData\\</ImageLoaded>',"      </ImageLoad>",'      <DnsQuery onmatch="exclude">','        <QueryName condition="end with">.windowsupdate.com</QueryName>',"      </DnsQuery>","    </RuleGroup>"],hi:[4,7,10],notes:["**ProcessCreate με exclude**: καταγράφονται όλες οι διεργασίες εκτός από τις ρητά εξαιρούμενες — προτιμούμε πληρότητα στην πιο κρίσιμη πηγή.","**ProcessAccess με include** μόνο για lsass.exe: μικρός όγκος, υψηλή αξία, κάλυψη της T1003.001.","**ImageLoad με include** σε εγγράψιμους φακέλους: πιάνει DLL sideloading χωρίς να πλημμυρίζει το SIEM με φορτώσεις System32."]})],["Προχωρημένα συμβάντα",$("Splunk: κυνήγι EID 10 προς lsass.exe","6.9 Στιγμιότυπο · ερώτημα κυνηγιού","Splunk · Search & Reporting",{path:'index=sysmon EventCode=10 TargetImage="*\\\\lsass.exe" | stats count by SourceImage GrantedAccess',tabs:["Events","Statistics (5)","Visualization"],cols:["SourceImage","GrantedAccess","count","Αξιολόγηση"],rows:[["C:\\Windows\\System32\\csrss.exe","0x1000","412","Φυσιολογικό"],["C:\\Windows\\System32\\wininit.exe","0x1000","58","Φυσιολογικό"],["C:\\Program Files\\Windows Defender\\MsMpEng.exe","0x1fffff","36","AV — allowlist"],["C:\\Users\\ntsakos\\AppData\\Local\\Temp\\svhost32.exe","0x1010","2","ΥΠΟΠΤΟ"],["C:\\Windows\\System32\\taskmgr.exe","0x1410","1","Χειροκίνητο, έλεγχος χρήστη"]],hi:[3,4],notes:["Το **0x1010** (PROCESS_VM_READ + QUERY_LIMITED) από διεργασία στο Temp είναι το κλασικό αποτύπωμα dump διαπιστευτηρίων (T1003.001).","Ο συνολικός αριθμός είναι μικρός: με **στατιστική «σπανιότητας»** (stats count) οι ύποπτες διεργασίες ξεχωρίζουν από τον φυσιολογικό θόρυβο.","Το taskmgr με 0x1410 δεν είναι απαραίτητα κακόβουλο: ελέγχεται με τον χρήστη και τη χρονική στιγμή πριν τη ρύθμιση εξαίρεσης."]})],["Πώς προστατεύουμε την τηλεμετρία",Ae("Επιθέσεις στο Sysmon και πώς φαίνονται","6.7 Εμβάθυνση · παράκαμψη αισθητήρα",[["Εκφόρτωση οδηγού","Ο αντίπαλος με δικαιώματα διαχειριστή μπορεί να εκτελέσει `fltMC unload SysmonDrv`. Το Sysmon παύει να καταγράφει και ο σταθμός «σιωπά». Ανίχνευση: συμβάν υπηρεσίας/οδηγού στο System log (7036/…) και **διακοπή ροής συμβάντων** στο SIEM για τον συγκεκριμένο υπολογιστή."],["Αλλαγή διαμόρφωσης","Με `Sysmon64 -c νέο.xml` ο δράστης προσθέτει εξαιρέσεις για τα εργαλεία του. Το Sysmon καταγράφει αλλαγή στο EID 16 (ServiceConfigurationChange). Χρειάζεται ειδοποίηση για κάθε EID 16 και σύγκριση του hash του XML με το εγκεκριμένο."],["Παράκαμψη μέσω εξαιρέσεων","Αν η διαμόρφωση εξαιρεί ολόκληρους φακέλους ή ονόματα διεργασιών, ο αντίπαλος αντιγράφει το εργαλείο του εκεί. Οι εξαιρέσεις πρέπει να ταυτίζονται με **πλήρη διαδρομή και υπογραφή** και να ελέγχονται περιοδικά με ερωτήματα «εξαιρέσεις που δεν πρέπει να υπάρχουν»."]],"Ο αισθητήρας πρέπει να προστατεύεται όπως το πειστήριο: **ιδιοκτήτης, ειδοποίηση, ιχνηλασιμότητα**")],["Η φιλοσοφία της διαμόρφωσης",Ae("Πώς επιλέγουμε τι θα καταγράφουμε","6.6 Εμβάθυνση · σχεδιασμός θορύβου",[["Ξεκινάμε από ερώτημα","Κάθε κανόνας διαμόρφωσης πρέπει να αντιστοιχεί σε **τεχνική ATT&CK και σε ερώτημα έρευνας**. Αν δεν μπορείς να πεις ποια ανίχνευση ή έρευνα εξυπηρετεί, μάλλον παράγει απλώς όγκο."],["Μετράμε τον όγκο","Ένας τυπικός σταθμός παράγει από μερικές χιλιάδες έως εκατοντάδες χιλιάδες συμβάντα Sysmon την ημέρα, κυρίως EID 3, 7, 22. Μετράμε ανά EID και ανά εικόνα (Image) και εξαιρούμε τους μεγαλύτερους παραγωγούς μόνο εφόσον είναι γνωστοί και υπογεγραμμένοι."],["Δοκιμάζουμε και συντηρούμε","Κάθε αλλαγή δοκιμάζεται σε ομάδα πιλότο και επαληθεύεται ότι οι κρίσιμες ανιχνεύσεις (π.χ. Atomic Red Team T1003.001) εξακολουθούν να ενεργοποιούνται. Η διαμόρφωση αναθεωρείται κάθε τρίμηνο για νέες εφαρμογές και τεχνικές."]],"Κανόνας: **ό,τι εξαιρείς, το εξαιρείς και για τον αντίπαλο**")]]},a2={notes:{"Γιατί η μνήμη":"Η μνήμη είναι η μοναδική πηγή για κώδικα που δεν έχει αγγίξει τον δίσκο (fileless), για κλειδιά κρυπτογράφησης και για την πραγματική κατάσταση των διεργασιών. Ένα rootkit μπορεί να «λέει ψέματα» στο ΛΣ, αλλά οι δομές του πυρήνα στη RAM αποκαλύπτουν συχνά την αλήθεια.","Τι περιέχει μια αποτύπωση μνήμης":"Μια αποτύπωση δεν είναι «φωτογραφία» της ίδιας στιγμής: η λήψη διαρκεί λεπτά και οι δομές αλλάζουν κατά τη διάρκειά της (smearing). Το αποτέλεσμα είναι αρκετά αξιόπιστο για ανάλυση αλλά ο ερευνητής το τεκμηριώνει ως περιορισμό.","Ανάλυση με Volatility 3":"Το Volatility 3 χρειάζεται πίνακες συμβόλων (ISF) για την έκδοση του πυρήνα· για Windows τους κατεβάζει αυτόματα από τη Microsoft, για Linux πρέπει να δημιουργηθούν από τον πυρήνα του συστήματος. Χωρίς σωστά σύμβολα τα plugins αποτυγχάνουν ή δίνουν λάθη.","Ροή ανάλυσης μνήμης":"Η ροή μοιάζει με εκδρομή από το γενικό στο ειδικό: πληροφορίες συστήματος, λίστα διεργασιών, δέντρο και γραμμές εντολών, δίκτυο, injections και τέλος εξαγωγή δείγματος για YARA και ανάλυση. Κάθε βήμα ελέγχεται με το προηγούμενο για συνέπεια.","Ζωντανό τριάζ σε Linux":"Στο Linux τα πάντα εκτίθενται ως αρχεία στο /proc. Ένα εκτελέσιμο που διαγράφηκε εμφανίζεται ως «(deleted)» αλλά μπορεί να αντιγραφεί από τον σύνδεσμο /proc/PID/exe. Η ίδια τεχνική ισχύει και για βιβλιοθήκες που έχουν φορτωθεί από το /proc/PID/map_files.","pslist εναντίον psscan":"Το pslist ακολουθεί τη διπλά συνδεδεμένη λίστα ActiveProcessLinks του πυρήνα· ένα rootkit που αφαιρεί τον κόμβο (DKOM) κρύβει τη διεργασία. Το psscan αναζητά **σχήμα δομής EPROCESS** σε όλη τη μνήμη και την εντοπίζει. Η διαφορά δεν είναι πάντα κακόβουλη: μια διεργασία που τερματίστηκε πρόσφατα εμφανίζεται μόνο στο psscan.","Δύο τρόποι να δεις τις διεργασίες":"Ο πιο ασφαλής κανόνας: η διεργασία που δεν έχει Exit time και λείπει από pslist είναι ένδειξη απόκρυψης· με Exit time είναι απλώς τερματισμένη. Συνήθως διασταυρώνουμε και με το pstree (γονέας) και το thrdscan (νήματα).","Πώς κρύβεται μια διεργασία":"Το DKOM (Direct Kernel Object Manipulation) απαιτεί κώδικα πυρήνα, δηλαδή δικαιώματα υψηλού επιπέδου. Πιο συνηθισμένη στην πράξη είναι η απλή μεταμφίεση (όνομα σαν svchost) και το process hollowing, όπου ένα νόμιμο εκτελέσιμο «αδειάζει» και γεμίζει με κακόβουλο κώδικα.","Injections και δίκτυο":"Το malfind ψάχνει περιοχές μνήμης (VAD) με δικαιώματα εκτέλεσης και εγγραφής που δεν αντιστοιχούν σε αρχείο στο δίσκο. Δεν αποδεικνύει κακόβουλο μόνο του — ορισμένα JIT (π.χ. .NET, browsers) παράγουν παρόμοια περιοχές — γι' αυτό ελέγχουμε MZ header, διεργασία και δίκτυο.","Όρια και παγίδες":"Οι σύγχρονες προστασίες (VBS, HVCI, Credential Guard) περιορίζουν την πρόσβαση στη μνήμη πυρήνα και το LSASS. Η λήψη μνήμης μπορεί να απαιτεί υπογεγραμμένο οδηγό και να αποτύχει· σε τέτοιες περιπτώσεις η τεκμηρίωση του λόγου αποτυχίας είναι μέρος της αναφοράς.","Σειρά ενεργειών σε ζωντανό περιστατικό":"Η σειρά αντιστοιχεί στην πτητικότητα: μνήμη πρώτα, μετά κατάσταση δικτύου και διεργασιών, μετά περιορισμός (απομόνωση, όχι επανεκκίνηση) και τελευταίος ο δίσκος. Η απόκλιση από αυτή τη σειρά πρέπει να καταγράφεται με το σκεπτικό της.","Χρονογραμμή μνήμης":"Το plugin timeliner συγκεντρώνει χρονοσφραγίδες από διεργασίες, δίκτυο, αρχεία και μητρώο σε ενιαία χρονογραμμή. Ενώνεται με την χρονογραμμή δίσκου (MFT/USN) και logs, ώστε να φαίνεται πότε συνέβη κάθε γεγονός σε όλες τις πηγές."},add:[["Ροή ανάλυσης μνήμης",$("Volatility 3: pstree και ύποπτη διεργασία","7.5 Στιγμιότυπο · windows.pstree","Volatility 3 Framework · windows.pstree",{path:"python3 vol.py -f FIN-WS-114.raw windows.pstree",lines:["PID   PPID  ImageFileName    Offset(V)        Threads  CreateTime","4     0     System           0xfa8000c5d040   112      2026-03-13 21:02:11","* 388  4    smss.exe         0xfa8001a2b060   2        2026-03-13 21:02:11","* 4408 3720 explorer.exe     0xfa80025ac9e0   48       2026-03-13 21:05:33","** 5108 4408 WINWORD.EXE     0xfa8003d15060   21       2026-03-13 22:35:10","*** 5266 5108 wscript.exe    0xfa8002f42060   6        2026-03-13 22:38:20","**** 5312 5266 svhost32.exe  0xfa8002d3e060   9        2026-03-13 22:38:59","* 780  588  svchost.exe      0xfa8000f4b060   17       2026-03-13 21:02:20","* 6744 4408 svhost32.exe     0xfa8003b8f060   3        2026-03-13 22:41:07   (μόνο στο psscan)"],hi:[5,6,8],notes:["Η **αλυσίδα γονέων** WINWORD → wscript → svhost32 δείχνει εκτέλεση script μέσα από έγγραφο Office — από μόνη της αρκεί για κλιμάκωση.","Το όνομα **svhost32.exe** μιμείται το svchost.exe αλλά έχει γονέα explorer/wscript, όχι το services.exe. Ο νόμιμος svchost έχει πάντα γονέα το services.exe.","Η διεργασία **6744** εμφανίζεται μόνο στο psscan χωρίς Exit time: υποψήφια κρυμμένη διεργασία που αξίζει ξεχωριστή έρευνα."]})],["Injections και δίκτυο",$("Volatility 3: netscan και malfind δίπλα-δίπλα","7.6 Στιγμιότυπο · δίκτυο και injected κώδικας","Volatility 3 · windows.netscan / windows.malfind",{path:"…netscan | grep svhost32  ·  …malfind --pid 5312",cols:["Proto","Local","Foreign","State","PID","Owner","Εύρημα malfind"],rows:[["TCPv4","10.20.30.114:51922","198.51.100.44:443","ESTABLISHED","5312","svhost32.exe","VAD 0x1f0000–0x1f9fff RWX, MZ"],["TCPv4","10.20.30.114:51930","198.51.100.44:443","ESTABLISHED","5312","svhost32.exe","—"],["TCPv4","10.20.30.114:49731","10.20.30.10:445","CLOSED","4","System","—"],["TCPv4","10.20.30.114:52010","203.0.113.20:443","ESTABLISHED","3720","chrome.exe","JIT RWX, χωρίς MZ"]],hi:[0,3],notes:["Η διεργασία **5312** διατηρεί δύο συνδέσεις προς την ίδια IP και έχει RWX περιοχή με MZ: ταιριάζει με injected PE που επικοινωνεί με C2.","Ο **chrome.exe** έχει επίσης RWX (JIT της JavaScript) αλλά **χωρίς MZ** — παράδειγμα ψευδώς θετικού malfind που ξεχωρίζει με τον έλεγχο header.","Η IP 198.51.100.44 εμφανίζεται και στο Zeek, στο Sysmon (EID 3) και στο 4688. Η μνήμη προσθέτει την **ιδιοκτησία** σε συγκεκριμένη διεργασία."]})],["Ζωντανό τριάζ σε Linux",$("Linux: /proc/2210 αποκαλύπτει κρυμμένο δυαδικό","7.4 Στιγμιότυπο · ζωντανό τριάζ","bash · root@web-01",{path:"ls -l /proc/2210/{exe,cwd,fd} ; cat /proc/2210/maps | grep rwx",lines:["$ ls -l /proc/2210/exe /proc/2210/cwd","lrwxrwxrwx 1 root root 0 Mar 14 09:40 /proc/2210/exe -> /tmp/.x/kworker (deleted)","lrwxrwxrwx 1 root root 0 Mar 14 09:40 /proc/2210/cwd -> /tmp/.x","$ ls -l /proc/2210/fd | head -4","lrwx------ 1 root root 64 Mar 14 09:40 3 -> socket:[41827]","lrwx------ 1 root root 64 Mar 14 09:40 4 -> /dev/null","$ ss -tanp | grep 2210",'ESTAB 0 0 10.20.30.40:44210 198.51.100.44:443 users:(("kworker",pid=2210,fd=3))',"$ cp /proc/2210/exe /mnt/usb/pid2210.elf && sha256sum /mnt/usb/pid2210.elf","d41e2f7c…a09b  /mnt/usb/pid2210.elf"],hi:[1,7,9],notes:["Το **(deleted)** σημαίνει ότι το αρχείο σβήστηκε από τον δίσκο αλλά η διεργασία τρέχει ακόμη. Το όνομα «kworker» μιμείται νήμα πυρήνα.","Το socket με **fd=3** δένεται με τη σύνδεση προς 198.51.100.44:443: ίδια IP με το υπόλοιπο περιστατικό.","Η αντιγραφή από `/proc/PID/exe` ανασύρει το δυαδικό **πριν χαθεί**. Το hash καταγράφεται αμέσως και το δείγμα μεταφέρεται σε ασφαλές περιβάλλον ανάλυσης."]})],["Πώς κρύβεται μια διεργασία",Ae("Process hollowing βήμα προς βήμα","7.6 Εμβάθυνση · πώς λειτουργεί και πώς φαίνεται",[["Πώς εκτελείται","Ο δράστης δημιουργεί νόμιμη διεργασία σε κατάσταση αναστολής (π.χ. `svchost.exe` με CREATE_SUSPENDED), αποδεσμεύει (unmap) τον αρχικό κώδικα, εγγράφει τον κακόβουλο κώδικα στη μνήμη και ξαναρχίζει το νήμα. Στο δίσκο και στη λίστα διεργασιών φαίνεται νόμιμο εκτελέσιμο."],["Πώς φαίνεται στη μνήμη","Η εικόνα της διεργασίας στη μνήμη **δεν ταιριάζει** με το αρχείο στο δίσκο: το VAD έχει δικαιώματα RWX, η διαδρομή δείχνει σε νόμιμο αρχείο αλλά ο κώδικας έχει MZ header και συμπεριφορά δικτύου. Το EID 25 του Sysmon (ProcessTampering) το ανιχνεύει σε ζωντανή λειτουργία."],["Τι κάνει ο ερευνητής","Χρησιμοποιεί `malfind` και `vadinfo` για τις ύποπτες περιοχές, εξάγει την περιοχή (`--dump`), υπολογίζει hash και τρέχει YARA. Συγκρίνει με το αρχείο του δίσκου (hash) και ελέγχει τον γονέα και τη γραμμή εντολών για ασυνήθιστες αναντιστοιχίες."]],"Ένδειξη-κλειδί: **νόμιμο όνομα + λάθος γονέας + RWX περιοχή με MZ**")],["Όρια και παγίδες",Ae("Απόκτηση μνήμης: εργαλεία και αποφάσεις","7.2 Εμβάθυνση · πώς επιλέγουμε",[["Windows","Εργαλεία όπως **WinPmem**, DumpIt ή Magnet RAM Capture φορτώνουν οδηγό και γράφουν τη φυσική μνήμη σε αρχείο. Εκτελούνται από εξωτερικό μέσο, με έξοδο σε άλλο δίσκο. Σε συστήματα με VBS/HVCI ο οδηγός μπορεί να μην φορτώνει· τότε εξετάζεται λήψη μέσω hypervisor ή crash dump."],["Linux","Το **LiME** είναι μονάδα πυρήνα που πρέπει να μεταγλωττιστεί για τον συγκεκριμένο πυρήνα· το **AVML** της Microsoft είναι στατικό εκτελέσιμο που διαβάζει /proc/kcore ή /dev/crash χωρίς μονάδα. Επιλέγεται το εργαλείο που δεν απαιτεί εγκατάσταση στον στόχο."],["Εικονικές μηχανές και νέφος","Σε VM το πιο καθαρό είναι snapshot με μνήμη (.vmem/.vmss) από τον hypervisor, χωρίς να αγγιχθεί ο guest. Στο νέφος εξαρτάται από τον πάροχο (π.χ. snapshot με μνήμη σε ορισμένες υπηρεσίες)· σε αντίθετη περίπτωση χρησιμοποιείται πράκτορας εντός του guest."]],"Πάντα: **hash αμέσως μετά τη λήψη** και καταγραφή εργαλείου/έκδοσης/ώρας")]]},n2={notes:{"Η ταυτότητα ως πεδίο μάχης":"Οι επιτιθέμενοι σπάνια «σπάνε» συστήματα όταν μπορούν να συνδεθούν. Σε πολλά περιστατικά (Uber 2022, Okta/Lapsus$ 2022) η αρχική πρόσβαση ήταν έγκυρα διαπιστευτήρια και κοινωνική μηχανική. Η ανάλυση ταυτότητας είναι πρωταρχική πηγή ερευνών.","DNS: τηλεμετρία και δίαυλος":"Το DNS καταγράφεται σε τρία σημεία: στον resolver, στον σταθμό (Sysmon EID 22) και στο δίκτυο (Zeek dns.log). Μόνο το Sysmon λέει **ποια διεργασία** ρώτησε· ο resolver λέει **ποιος** πελάτης, και το Zeek **τι** ακριβώς πέρασε στο καλώδιο.","Ενδείξεις κακόβουλου DNS":"Καμία ένδειξη δεν αρκεί μόνη: τα CDN έχουν και αυτά μεγάλα ονόματα, και τα antivirus κάνουν τακτικά ερωτήματα. Ο συνδυασμός μήκους, εντροπίας, ρυθμού και «πρώτης εμφάνισης» του domain (newly registered) ενισχύει την υποψία.","Email: κεφαλίδες και έλεγχοι":"Οι κεφαλίδες `Received:` προστίθενται από κάθε σταθμό της διαδρομής, οπότε ο πρώτος εξωτερικός σταθμός (κάτω-κάτω) δίνει την πραγματική προέλευση. Ο αποστολέας μπορεί να πλαστογραφήσει το `From:` αλλά όχι το αποτέλεσμα των SPF/DKIM/DMARC που υπολογίζει ο δικός σας διακομιστής.","Πώς διαβάζουμε μία κεφαλίδα":"Πάντα εξάγετε την **πλήρη πηγή του μηνύματος (.eml)** και όχι στιγμιότυπο οθόνης: οι αποκωδικοποιημένες προβολές κρύβουν κεφαλίδες. Το .eml αποτελεί πειστήριο με hash και τεκμηρίωση, ακριβώς όπως ένα αρχείο.","Αρχεία πρόσβασης διακομιστών ιστού":"Τα access logs καταγράφουν αιτήματα, όχι εκτέλεση. Ένα `200` σε POST στο /uploads/x.php δείχνει ότι ο διακομιστής απάντησε επιτυχώς — όχι απαραίτητα τι εκτελέστηκε. Η συσχέτιση με διεργασίες (w3wp/php-fpm) και αρχεία στο δίσκο δίνει τη βεβαιότητα.","Επιθέσεις στο Active Directory":"Οι επιθέσεις AD αφήνουν ίχνη στον ελεγκτή τομέα, όχι στον σταθμό-στόχο. Γι' αυτό τα Security logs των DC πρέπει να συλλέγονται κεντρικά με επαρκή διατήρηση και ενεργοποιημένους ελέγχους (Kerberos Service Ticket Operations, Directory Service Access).","Μονοπάτι επίθεσης στο AD":"Το τυπικό μονοπάτι: αρχικός λογαριασμός → Kerberoasting για υπηρεσία με ισχυρά δικαιώματα → πλευρική κίνηση → Domain Admin → DCSync και επιμονή με Golden Ticket. Κάθε βήμα έχει δικό του συμβάν στον ελεγκτή τομέα.","AiTM phishing: υποκλοπή συνεδρίας":"Το Evilginx (2017) και παρόμοια εργαλεία λειτουργούν ως αντίστροφοι διαμεσολαβητές: το θύμα βλέπει την πραγματική σελίδα σύνδεσης, ο δράστης κρατά το cookie συνεδρίας. Το MFA με push, SMS ή κωδικό μίας χρήσης δεν προστατεύει· τα κλειδιά FIDO2 (δέσμευση με domain) προστατεύουν.","Η ροή του AiTM":"Η ροή δεν αφήνει «κακόβουλο αρχείο» στο σταθμό, οπότε το EDR δεν ειδοποιεί. Η ανίχνευση γίνεται στην ταυτότητα: sign-in από άλλη IP/User-Agent με το ίδιο session ID, και νέες ενέργειες στο mailbox (κανόνες προώθησης).","Webshell: ο διακομιστής":"Τα webshells είναι μικρά (συχνά μία γραμμή) και συχνά κρυπτογραφημένα/obfuscated. Ανιχνεύονται από συνδυασμό: νέο αρχείο script σε φάκελο ιστού, POST με παραμέτρους εντολών και παιδιά της διεργασίας του web server (w3wp.exe → cmd.exe, whoami).","Τεκμήρια webshell":"Η ανάλυση στηρίζεται σε τέσσερις πηγές μαζί: αρχείο στο δίσκο (με χρονοσφραγίδες), access log, διεργασίες (Sysmon 1: w3wp → cmd) και δίκτυο (εξερχόμενη κίνηση από τον web server). Μία πηγή δεν αρκεί για βεβαιότητα."},add:[["Πώς διαβάζουμε μία κεφαλίδα",$("Πλήρης κεφαλίδα ενός phishing email","8.3 Στιγμιότυπο · invoice.eml","Email Source · invoice.eml",{path:"evidence/mail/invoice.eml · sha256=1d0c…",lines:["Received: from mx.corp-example.com (10.20.0.25) by mbx01.corp-example.com; Fri, 13 Mar 2026 22:29:44 +0000","Received: from mail.evil.example (mail.evil.example [198.51.100.77]) by mx.corp-example.com with ESMTPS; Fri, 13 Mar 2026 22:29:41 +0000","Authentication-Results: mx.corp-example.com; spf=fail smtp.mailfrom=corp-examp1e.net; dkim=none; dmarc=fail header.from=corp-example.com","Return-Path: <bounce@corp-examp1e.net>","From: Accounts <billing@corp-example.com>","Reply-To: billing@corp-examp1e.net","To: ntsakos@corp-example.com","Subject: Επείγον: Τιμολόγιο 2026-0311","Message-ID: <7c1a@mail.evil.example>","X-Mailer: PHPMailer 5.2.14",'Content-Type: multipart/mixed; boundary="----=_Part_331"','Content-Disposition: attachment; filename="invoice.vbs"'],hi:[1,2,5],notes:["Ο **πρώτος εξωτερικός σταθμός** (Received κάτω) δείχνει το πραγματικό σημείο προέλευσης: 198.51.100.77 (mail.evil.example) και όχι το domain του From.","**spf=fail, dkim=none, dmarc=fail**: ο διακομιστής μας δεν πείστηκε ότι το μήνυμα προέρχεται από την εταιρεία — ο έλεγχος όμως δεν οδήγησε σε απόρριψη.","Το **Reply-To** στο παρόμοιο domain corp-**examp1e**.net δείχνει προσπάθεια εξαπάτησης ώστε οι απαντήσεις να πηγαίνουν στον δράστη."]})],["Αρχεία πρόσβασης διακομιστών ιστού",$("access.log: από τη σάρωση στο webshell","8.5 Στιγμιότυπο · nginx access.log","nginx · /var/log/nginx/access.log",{path:"grep 198.51.100.44 access.log | sed -n '1,200p' (επιλογή γραμμών)",lines:['198.51.100.44 - - [13/Mar/2026:21:58:03 +0000] "GET /wp-login.php HTTP/1.1" 200 4512 "-" "python-requests/2.31"','198.51.100.44 - - [13/Mar/2026:21:58:04 +0000] "GET /.env HTTP/1.1" 404 162 "-" "python-requests/2.31"','198.51.100.44 - - [13/Mar/2026:21:58:05 +0000] "GET /admin/config.php HTTP/1.1" 404 162 "-" "python-requests/2.31"','198.51.100.44 - - [13/Mar/2026:22:13:41 +0000] "POST /wp-admin/admin-ajax.php?action=upload HTTP/1.1" 200 88 "-" "Mozilla/5.0"','198.51.100.44 - - [13/Mar/2026:22:14:02 +0000] "POST /uploads/x.php HTTP/1.1" 200 512 "-" "Mozilla/5.0"','198.51.100.44 - - [13/Mar/2026:22:14:09 +0000] "POST /uploads/x.php?cmd=id HTTP/1.1" 200 48 "-" "Mozilla/5.0"','198.51.100.44 - - [13/Mar/2026:22:14:31 +0000] "POST /uploads/x.php?cmd=whoami HTTP/1.1" 200 12 "-" "Mozilla/5.0"'],hi:[1,3,5],notes:["Η σάρωση με **python-requests** και πολλά 404 ταυτίζεται με αυτοματοποιημένη αναγνώριση — συνήθως ακολουθεί εκμετάλλευση μέσα σε λεπτά ή ώρες.","Το **upload** (22:13:41) επιστρέφει 200 και ακολουθεί αμέσως αίτημα στο νέο αρχείο x.php: το αρχείο δημιουργήθηκε από την εκμετάλλευση.","Το `?cmd=id` και `?cmd=whoami` δείχνουν **εκτέλεση εντολών** μέσω webshell. Από αυτή τη στιγμή ο έλεγχος της διεργασίας του web server είναι του δράστη."]})],["Επιθέσεις στο Active Directory",$("DC Security log: Kerberoasting στο 4769","8.6
